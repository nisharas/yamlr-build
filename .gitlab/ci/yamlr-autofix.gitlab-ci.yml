yamlr-autofix:
  stage: test
  image: python:3.12-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  before_script:
    - apt-get update && apt-get install -y git
    - pip install --upgrade pip
    - pip install yamlr
  script:
    - python -c "from yamlr.ci.autofix import execute_autofix; execute_autofix('.', create_pr=False)"
