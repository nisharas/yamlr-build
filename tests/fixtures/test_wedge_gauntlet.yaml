apiVersion: apps/v1
kind: Deployment
metadata:
  name: wedge-gauntlet
  namespace: "default"
spec:
  replicass: "3"  # Typo + Quoted Int
  selector:
    matchLabels:
      app: gauntlet
  template:
    metadata:
      labels:
        app: gauntlet
    spec:
      imagePullSecret:  # Typo (singular) + Map-vs-List (should be array of objects)
        name: my-secret
      containers:
      - name: web
        image: nginx:latest
        ports:  # Map-vs-List (should be array)
          containerPort: "8080" # Quoted Int
        resources:
          limits:
            cpu: 500m
            memory: "0.5Gi" # Should stay string (likely valid, but testing coercion)
        env:
          - name: DEBUG
            value: "true" # Should stay string for env, but testing coercer logic
      initContainers: # Singular as list (already correct, but checking stability)
      - name: init
        image: busybox
        command: ["sh", "-c", "echo hello"]
