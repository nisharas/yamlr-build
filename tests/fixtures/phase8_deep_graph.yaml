apiVersion: v1
kind: Namespace
metadata:
  name: storage-ns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-owner
  namespace: storage-ns
  ownerReferences:
  - apiVersion: batch/v1
    kind: CronJob
    name: site-manager
spec:
  template:
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        volumeMounts:
        - name: web-data
          mountPath: /usr/share/nginx/html
      volumes:
      - name: web-data
        persistentVolumeClaim:
          claimName: web-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: web-pvc
  namespace: storage-ns
spec:
  accessModes: ["ReadWriteOnce"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: site-manager
  namespace: storage-ns
spec:
  schedule: "0 0 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: manager
            image: busybox
          restartPolicy: OnFailure
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: nginx-slice
  namespace: storage-ns
  labels:
    kubernetes.io/service-name: nginx-owner
addressType: IPv4
endpoints:
  - addresses: ["10.1.1.1"]
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-owner
  namespace: storage-ns
spec:
  ports:
  - port: 80
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: nginx-vpa
  namespace: storage-ns
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: nginx-owner
  updatePolicy:
    updateMode: "Auto"
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: standard-gw-class
spec:
  controllerName: "example.com/controller"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: prod-gateway
  namespace: storage-ns
spec:
  gatewayClassName: standard-gw-class
  listeners:
  - name: http
    protocol: HTTP
    port: 80
---
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: storage-ns
  annotations:
    kms.key.id: "arn:aws:kms:us-east-1:123456789012:key/abc-123"
type: Opaque
data:
  password: cGFzc3dvcmQ=
