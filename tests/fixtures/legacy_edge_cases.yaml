# Test 1: Double-dash normalization
containers:
- - image: nginx
    name: web
---
# Test 2: Document boundary block reset
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-block
data:
  content: |
    This is a block
    that ends here
---
# This should NOT be considered part of the previous block
# If leakage occurred, the lexer would think we are still in a block.
apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  ports:
  - port: 80
---
# Test 3: Namespace Enforcement
apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-ns
spec:
  template:
    spec:
      containers:
      - name: web
        image: nginx
