apiVersion: apps/v1
kind: Deployment
metadata:
  name: privileged-i13228
spec:
  replicas: 1
  selector:
    matchLabels:
      app: privileged-i13228
  template:
    metadata:
      labels:
        app: privileged-i13228
    spec:
      containers:
      - name: nginx
        image: nginx:1.19
        securityContext:
          privileged: true
