apiVersion: v1
kind: Service
metadata:
  name: ghost-svc-i4756
spec:
  selector:
    app: myapp-i4756
  ports:
  - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghost-deploy-i4756
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp-i4756
  template:
    metadata:
      labels:
        app: myapp-i4756
    spec:
      containers:
      - name: nginx
        image: nginx:1.19
