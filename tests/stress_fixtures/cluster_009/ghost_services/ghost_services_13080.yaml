apiVersion: v1
kind: Service
metadata:
  name: ghost-svc-i4017
spec:
  selector:
    app: myapp-i4017
  ports:
  - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghost-deploy-i4017
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp-i4017
  template:
    metadata:
      labels:
        app: myapp-i4017
    spec:
      containers:
      - name: nginx
        image: nginx:1.19
