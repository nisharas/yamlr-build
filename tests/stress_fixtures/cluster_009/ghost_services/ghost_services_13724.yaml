apiVersion: v1
kind: Service
metadata:
  name: ghost-svc-i3948
spec:
  selector:
    app: myapp-i3948
  ports:
  - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghost-deploy-i3948
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp-i3948
  template:
    metadata:
      labels:
        app: myapp-i3948
    spec:
      containers:
      - name: nginx
        image: nginx:1.19
