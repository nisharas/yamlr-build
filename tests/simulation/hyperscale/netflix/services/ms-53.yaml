apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-53
  labels:
    app: ms-53
    dependency: ms-54
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-53
  template:
    metadata:
      labels:
        app: ms-53
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-54