apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-185
  labels:
    app: ms-185
    dependency: ms-186
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-185
  template:
    metadata:
      labels:
        app: ms-185
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-186