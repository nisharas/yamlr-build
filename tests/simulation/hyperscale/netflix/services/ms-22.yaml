apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-22
  labels:
    app: ms-22
    dependency: ms-23
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-22
  template:
    metadata:
      labels:
        app: ms-22
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-23