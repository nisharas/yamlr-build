apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-266
  labels:
    app: ms-266
    dependency: ms-267
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-266
  template:
    metadata:
      labels:
        app: ms-266
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-267