apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-980
  labels:
    app: ms-980
    dependency: ms-981
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-980
  template:
    metadata:
      labels:
        app: ms-980
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-981