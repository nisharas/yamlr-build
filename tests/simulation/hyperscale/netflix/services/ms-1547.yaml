apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-1547
  labels:
    app: ms-1547
    dependency: ms-1548
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-1547
  template:
    metadata:
      labels:
        app: ms-1547
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-1548