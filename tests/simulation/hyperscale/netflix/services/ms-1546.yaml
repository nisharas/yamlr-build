apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-1546
  labels:
    app: ms-1546
    dependency: ms-1547
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-1546
  template:
    metadata:
      labels:
        app: ms-1546
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-1547