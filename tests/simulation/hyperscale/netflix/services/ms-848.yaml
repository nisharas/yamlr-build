apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-848
  labels:
    app: ms-848
    dependency: ms-849
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-848
  template:
    metadata:
      labels:
        app: ms-848
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-849