apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-229
  labels:
    app: ms-229
    dependency: ms-230
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-229
  template:
    metadata:
      labels:
        app: ms-229
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-230