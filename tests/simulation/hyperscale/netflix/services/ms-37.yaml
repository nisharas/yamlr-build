apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-37
  labels:
    app: ms-37
    dependency: ms-38
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-37
  template:
    metadata:
      labels:
        app: ms-37
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-38