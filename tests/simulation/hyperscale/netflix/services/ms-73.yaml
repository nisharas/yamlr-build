apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-73
  labels:
    app: ms-73
    dependency: ms-74
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-73
  template:
    metadata:
      labels:
        app: ms-73
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-74