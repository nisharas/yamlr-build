apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-326
  labels:
    app: ms-326
    dependency: ms-327
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-326
  template:
    metadata:
      labels:
        app: ms-326
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-327