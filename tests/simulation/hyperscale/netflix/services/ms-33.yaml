apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-33
  labels:
    app: ms-33
    dependency: ms-34
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-33
  template:
    metadata:
      labels:
        app: ms-33
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-34