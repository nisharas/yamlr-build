apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-608
  labels:
    app: ms-608
    dependency: ms-609
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-608
  template:
    metadata:
      labels:
        app: ms-608
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-609