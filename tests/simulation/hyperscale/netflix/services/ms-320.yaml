apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-320
  labels:
    app: ms-320
    dependency: ms-321
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-320
  template:
    metadata:
      labels:
        app: ms-320
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-321