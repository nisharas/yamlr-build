apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-151
  labels:
    app: ms-151
    dependency: ms-152
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-151
  template:
    metadata:
      labels:
        app: ms-151
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-152