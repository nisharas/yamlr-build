apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-28
  labels:
    app: ms-28
    dependency: ms-29
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-28
  template:
    metadata:
      labels:
        app: ms-28
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-29