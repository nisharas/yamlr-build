apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-489
  labels:
    app: ms-489
    dependency: ms-490
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-489
  template:
    metadata:
      labels:
        app: ms-489
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-490