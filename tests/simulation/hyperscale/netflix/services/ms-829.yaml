apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-829
  labels:
    app: ms-829
    dependency: ms-830
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-829
  template:
    metadata:
      labels:
        app: ms-829
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-830