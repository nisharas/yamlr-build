apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-679
  labels:
    app: ms-679
    dependency: ms-680
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-679
  template:
    metadata:
      labels:
        app: ms-679
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-680