apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-825
  labels:
    app: ms-825
    dependency: ms-826
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-825
  template:
    metadata:
      labels:
        app: ms-825
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-826