apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-1710
  labels:
    app: ms-1710
    dependency: ms-1711
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-1710
  template:
    metadata:
      labels:
        app: ms-1710
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-1711