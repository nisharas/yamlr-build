apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-69
  labels:
    app: ms-69
    dependency: ms-70
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-69
  template:
    metadata:
      labels:
        app: ms-69
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-70