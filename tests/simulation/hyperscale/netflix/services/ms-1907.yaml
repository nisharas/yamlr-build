apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-1907
  labels:
    app: ms-1907
    dependency: ms-1908
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-1907
  template:
    metadata:
      labels:
        app: ms-1907
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-1908