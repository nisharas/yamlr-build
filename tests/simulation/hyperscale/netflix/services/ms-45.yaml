apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-45
  labels:
    app: ms-45
    dependency: ms-46
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-45
  template:
    metadata:
      labels:
        app: ms-45
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-46