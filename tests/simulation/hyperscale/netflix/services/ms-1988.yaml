apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-1988
  labels:
    app: ms-1988
    dependency: ms-1989
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-1988
  template:
    metadata:
      labels:
        app: ms-1988
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-1989