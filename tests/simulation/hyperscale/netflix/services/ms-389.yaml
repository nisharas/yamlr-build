apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-389
  labels:
    app: ms-389
    dependency: ms-390
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-389
  template:
    metadata:
      labels:
        app: ms-389
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-390