apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-215
  labels:
    app: ms-215
    dependency: ms-216
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-215
  template:
    metadata:
      labels:
        app: ms-215
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-216