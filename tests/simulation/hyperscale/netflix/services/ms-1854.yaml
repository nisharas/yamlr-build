apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-1854
  labels:
    app: ms-1854
    dependency: ms-1855
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-1854
  template:
    metadata:
      labels:
        app: ms-1854
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-1855