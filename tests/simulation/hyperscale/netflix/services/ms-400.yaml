apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-400
  labels:
    app: ms-400
    dependency: ms-401
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-400
  template:
    metadata:
      labels:
        app: ms-400
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-401