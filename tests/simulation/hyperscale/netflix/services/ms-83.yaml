apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-83
  labels:
    app: ms-83
    dependency: ms-84
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-83
  template:
    metadata:
      labels:
        app: ms-83
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-84