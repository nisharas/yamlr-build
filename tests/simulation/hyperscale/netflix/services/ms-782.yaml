apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-782
  labels:
    app: ms-782
    dependency: ms-783
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-782
  template:
    metadata:
      labels:
        app: ms-782
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-783