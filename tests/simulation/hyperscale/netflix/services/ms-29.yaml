apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-29
  labels:
    app: ms-29
    dependency: ms-30
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-29
  template:
    metadata:
      labels:
        app: ms-29
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-30