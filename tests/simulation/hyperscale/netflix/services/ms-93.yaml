apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-93
  labels:
    app: ms-93
    dependency: ms-94
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-93
  template:
    metadata:
      labels:
        app: ms-93
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-94