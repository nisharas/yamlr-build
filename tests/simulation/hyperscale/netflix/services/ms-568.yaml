apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-568
  labels:
    app: ms-568
    dependency: ms-569
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-568
  template:
    metadata:
      labels:
        app: ms-568
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-569