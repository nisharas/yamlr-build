apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-1141
  labels:
    app: ms-1141
    dependency: ms-1142
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-1141
  template:
    metadata:
      labels:
        app: ms-1141
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-1142