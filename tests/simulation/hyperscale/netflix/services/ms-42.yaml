apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-42
  labels:
    app: ms-42
    dependency: ms-43
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-42
  template:
    metadata:
      labels:
        app: ms-42
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-43