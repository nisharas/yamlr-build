apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-3
  labels:
    app: ms-3
    dependency: ms-4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-3
  template:
    metadata:
      labels:
        app: ms-3
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-4