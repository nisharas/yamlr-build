apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-746
  labels:
    app: ms-746
    dependency: ms-747
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-746
  template:
    metadata:
      labels:
        app: ms-746
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-747