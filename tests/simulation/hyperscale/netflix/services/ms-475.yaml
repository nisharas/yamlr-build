apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-475
  labels:
    app: ms-475
    dependency: ms-476
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-475
  template:
    metadata:
      labels:
        app: ms-475
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-476