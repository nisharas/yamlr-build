apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-78
  labels:
    app: ms-78
    dependency: ms-79
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-78
  template:
    metadata:
      labels:
        app: ms-78
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-79