apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-814
  labels:
    app: ms-814
    dependency: ms-815
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-814
  template:
    metadata:
      labels:
        app: ms-814
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-815