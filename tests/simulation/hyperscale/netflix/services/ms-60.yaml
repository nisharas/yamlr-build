apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-60
  labels:
    app: ms-60
    dependency: ms-61
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-60
  template:
    metadata:
      labels:
        app: ms-60
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-61