apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-121
  labels:
    app: ms-121
    dependency: ms-122
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-121
  template:
    metadata:
      labels:
        app: ms-121
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-122