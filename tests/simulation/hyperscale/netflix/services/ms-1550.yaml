apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-1550
  labels:
    app: ms-1550
    dependency: ms-1551
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-1550
  template:
    metadata:
      labels:
        app: ms-1550
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-1551