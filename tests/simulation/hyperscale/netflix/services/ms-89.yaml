apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-89
  labels:
    app: ms-89
    dependency: ms-90
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-89
  template:
    metadata:
      labels:
        app: ms-89
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-90