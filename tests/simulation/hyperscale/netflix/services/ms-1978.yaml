apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-1978
  labels:
    app: ms-1978
    dependency: ms-1979
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-1978
  template:
    metadata:
      labels:
        app: ms-1978
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-1979