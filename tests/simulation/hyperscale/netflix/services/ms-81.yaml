apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-81
  labels:
    app: ms-81
    dependency: ms-82
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-81
  template:
    metadata:
      labels:
        app: ms-81
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-82