apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-451
  labels:
    app: ms-451
    dependency: ms-452
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-451
  template:
    metadata:
      labels:
        app: ms-451
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-452