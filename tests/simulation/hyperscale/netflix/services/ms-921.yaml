apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-921
  labels:
    app: ms-921
    dependency: ms-922
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-921
  template:
    metadata:
      labels:
        app: ms-921
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-922