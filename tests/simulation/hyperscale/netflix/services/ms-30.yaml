apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-30
  labels:
    app: ms-30
    dependency: ms-31
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-30
  template:
    metadata:
      labels:
        app: ms-30
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-31