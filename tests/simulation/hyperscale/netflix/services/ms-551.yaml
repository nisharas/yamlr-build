apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-551
  labels:
    app: ms-551
    dependency: ms-552
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-551
  template:
    metadata:
      labels:
        app: ms-551
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-552