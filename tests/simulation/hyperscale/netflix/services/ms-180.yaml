apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-180
  labels:
    app: ms-180
    dependency: ms-181
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-180
  template:
    metadata:
      labels:
        app: ms-180
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-181