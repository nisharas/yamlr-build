apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-239
  labels:
    app: ms-239
    dependency: ms-240
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-239
  template:
    metadata:
      labels:
        app: ms-239
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-240