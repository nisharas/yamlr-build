apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-269
  labels:
    app: ms-269
    dependency: ms-270
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-269
  template:
    metadata:
      labels:
        app: ms-269
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-270