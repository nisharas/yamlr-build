apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-952
  labels:
    app: ms-952
    dependency: ms-953
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-952
  template:
    metadata:
      labels:
        app: ms-952
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-953