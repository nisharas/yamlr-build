apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-862
  labels:
    app: ms-862
    dependency: ms-863
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-862
  template:
    metadata:
      labels:
        app: ms-862
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-863