apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-507
  labels:
    app: ms-507
    dependency: ms-508
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-507
  template:
    metadata:
      labels:
        app: ms-507
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-508