apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-230
  labels:
    app: ms-230
    dependency: ms-231
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-230
  template:
    metadata:
      labels:
        app: ms-230
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-231