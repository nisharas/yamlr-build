apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-726
  labels:
    app: ms-726
    dependency: ms-727
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-726
  template:
    metadata:
      labels:
        app: ms-726
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-727