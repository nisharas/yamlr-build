apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-48
  labels:
    app: ms-48
    dependency: ms-49
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-48
  template:
    metadata:
      labels:
        app: ms-48
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-49