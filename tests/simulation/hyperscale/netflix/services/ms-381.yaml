apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-381
  labels:
    app: ms-381
    dependency: ms-382
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-381
  template:
    metadata:
      labels:
        app: ms-381
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-382