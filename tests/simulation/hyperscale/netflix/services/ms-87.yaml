apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-87
  labels:
    app: ms-87
    dependency: ms-88
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-87
  template:
    metadata:
      labels:
        app: ms-87
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-88