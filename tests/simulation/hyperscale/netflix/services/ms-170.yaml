apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-170
  labels:
    app: ms-170
    dependency: ms-171
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-170
  template:
    metadata:
      labels:
        app: ms-170
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-171