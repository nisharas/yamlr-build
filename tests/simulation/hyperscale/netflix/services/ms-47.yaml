apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-47
  labels:
    app: ms-47
    dependency: ms-48
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-47
  template:
    metadata:
      labels:
        app: ms-47
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-48