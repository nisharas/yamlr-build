apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-1045
  labels:
    app: ms-1045
    dependency: ms-1046
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-1045
  template:
    metadata:
      labels:
        app: ms-1045
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
