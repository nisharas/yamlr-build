apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-94
  labels:
    app: ms-94
    dependency: ms-95
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-94
  template:
    metadata:
      labels:
        app: ms-94
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-95