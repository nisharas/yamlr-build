apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-950
  labels:
    app: ms-950
    dependency: ms-951
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-950
  template:
    metadata:
      labels:
        app: ms-950
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-951