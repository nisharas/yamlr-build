apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-545
  labels:
    app: ms-545
    dependency: ms-546
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-545
  template:
    metadata:
      labels:
        app: ms-545
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-546