apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-1031
  labels:
    app: ms-1031
    dependency: ms-1032
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-1031
  template:
    metadata:
      labels:
        app: ms-1031
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-1032