apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-655
  labels:
    app: ms-655
    dependency: ms-656
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-655
  template:
    metadata:
      labels:
        app: ms-655
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-656