apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-178
  labels:
    app: ms-178
    dependency: ms-179
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-178
  template:
    metadata:
      labels:
        app: ms-178
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-179