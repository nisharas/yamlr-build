apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-46
  labels:
    app: ms-46
    dependency: ms-47
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-46
  template:
    metadata:
      labels:
        app: ms-46
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-47