apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-390
  labels:
    app: ms-390
    dependency: ms-391
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-390
  template:
    metadata:
      labels:
        app: ms-390
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-391