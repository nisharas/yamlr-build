apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-3543
  labels:
    app: ms-3543
    dependency: ms-3544
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-3543
  template:
    metadata:
      labels:
        app: ms-3543
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-3544