apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-365
  labels:
    app: ms-365
    dependency: ms-366
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-365
  template:
    metadata:
      labels:
        app: ms-365
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-366