apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-8180
  labels:
    app: ms-8180
    dependency: ms-8181
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-8180
  template:
    metadata:
      labels:
        app: ms-8180
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-8181