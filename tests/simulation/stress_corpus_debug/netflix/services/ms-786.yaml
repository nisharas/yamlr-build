apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-786
  labels:
    app: ms-786
    dependency: ms-787
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-786
  template:
    metadata:
      labels:
        app: ms-786
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-787