apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-434
  labels:
    app: ms-434
    dependency: ms-435
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-434
  template:
    metadata:
      labels:
        app: ms-434
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-435