apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-323
  labels:
    app: ms-323
    dependency: ms-324
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-323
  template:
    metadata:
      labels:
        app: ms-323
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-324