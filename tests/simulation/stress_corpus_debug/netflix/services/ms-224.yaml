apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-224
  labels:
    app: ms-224
    dependency: ms-225
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-224
  template:
    metadata:
      labels:
        app: ms-224
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-225