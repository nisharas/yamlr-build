apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-114
  labels:
    app: ms-114
    dependency: ms-115
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-114
  template:
    metadata:
      labels:
        app: ms-114
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-115