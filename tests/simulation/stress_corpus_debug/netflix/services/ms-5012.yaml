apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-5012
  labels:
    app: ms-5012
    dependency: ms-5013
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-5012
  template:
    metadata:
      labels:
        app: ms-5012
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-5013