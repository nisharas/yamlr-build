apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-4703
  labels:
    app: ms-4703
    dependency: ms-4704
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-4703
  template:
    metadata:
      labels:
        app: ms-4703
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-4704