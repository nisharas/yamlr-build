apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-98
  labels:
    app: ms-98
    dependency: ms-99
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-98
  template:
    metadata:
      labels:
        app: ms-98
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-99