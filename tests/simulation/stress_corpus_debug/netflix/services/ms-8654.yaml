apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-8654
  labels:
    app: ms-8654
    dependency: ms-8655
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-8654
  template:
    metadata:
      labels:
        app: ms-8654
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-8655