apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-77
  labels:
    app: ms-77
    dependency: ms-78
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-77
  template:
    metadata:
      labels:
        app: ms-77
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-78