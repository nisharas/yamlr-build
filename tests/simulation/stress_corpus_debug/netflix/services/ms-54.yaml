apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-54
  labels:
    app: ms-54
    dependency: ms-55
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-54
  template:
    metadata:
      labels:
        app: ms-54
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-55