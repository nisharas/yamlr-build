apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-6181
  labels:
    app: ms-6181
    dependency: ms-6182
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-6181
  template:
    metadata:
      labels:
        app: ms-6181
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-6182