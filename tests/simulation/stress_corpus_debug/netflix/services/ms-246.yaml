apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-246
  labels:
    app: ms-246
    dependency: ms-247
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-246
  template:
    metadata:
      labels:
        app: ms-246
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-247