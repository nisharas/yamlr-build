apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-5033
  labels:
    app: ms-5033
    dependency: ms-5034
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-5033
  template:
    metadata:
      labels:
        app: ms-5033
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-5034