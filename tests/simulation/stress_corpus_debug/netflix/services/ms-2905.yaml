apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-2905
  labels:
    app: ms-2905
    dependency: ms-2906
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-2905
  template:
    metadata:
      labels:
        app: ms-2905
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-2906