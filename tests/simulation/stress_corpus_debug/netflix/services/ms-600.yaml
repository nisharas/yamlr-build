apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-600
  labels:
    app: ms-600
    dependency: ms-601
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-600
  template:
    metadata:
      labels:
        app: ms-600
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-601