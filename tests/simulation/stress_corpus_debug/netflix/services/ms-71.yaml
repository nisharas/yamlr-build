apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-71
  labels:
    app: ms-71
    dependency: ms-72
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-71
  template:
    metadata:
      labels:
        app: ms-71
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-72