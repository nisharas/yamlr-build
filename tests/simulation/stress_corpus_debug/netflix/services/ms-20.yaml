apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-20
  labels:
    app: ms-20
    dependency: ms-21
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-20
  template:
    metadata:
      labels:
        app: ms-20
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-21