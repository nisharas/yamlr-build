apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-4109
  labels:
    app: ms-4109
    dependency: ms-4110
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-4109
  template:
    metadata:
      labels:
        app: ms-4109
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-4110