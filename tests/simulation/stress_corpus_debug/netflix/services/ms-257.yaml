apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-257
  labels:
    app: ms-257
    dependency: ms-258
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-257
  template:
    metadata:
      labels:
        app: ms-257
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-258