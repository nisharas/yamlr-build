apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-208
  labels:
    app: ms-208
    dependency: ms-209
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-208
  template:
    metadata:
      labels:
        app: ms-208
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-209