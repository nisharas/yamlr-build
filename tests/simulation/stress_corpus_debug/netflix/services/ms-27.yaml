apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-27
  labels:
    app: ms-27
    dependency: ms-28
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-27
  template:
    metadata:
      labels:
        app: ms-27
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-28