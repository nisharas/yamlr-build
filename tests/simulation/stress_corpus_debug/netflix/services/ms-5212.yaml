apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-5212
  labels:
    app: ms-5212
    dependency: ms-5213
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-5212
  template:
    metadata:
      labels:
        app: ms-5212
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-5213