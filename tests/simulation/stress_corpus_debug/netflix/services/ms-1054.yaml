apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-1054
  labels:
    app: ms-1054
    dependency: ms-1055
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-1054
  template:
    metadata:
      labels:
        app: ms-1054
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-1055