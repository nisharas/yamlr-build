apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-4052
  labels:
    app: ms-4052
    dependency: ms-4053
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-4052
  template:
    metadata:
      labels:
        app: ms-4052
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-4053