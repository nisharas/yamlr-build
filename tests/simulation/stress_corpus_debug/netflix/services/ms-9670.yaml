apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-9670
  labels:
    app: ms-9670
    dependency: ms-9671
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-9670
  template:
    metadata:
      labels:
        app: ms-9670
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-9671