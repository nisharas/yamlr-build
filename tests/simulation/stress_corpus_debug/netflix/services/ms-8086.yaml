apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-8086
  labels:
    app: ms-8086
    dependency: ms-8087
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-8086
  template:
    metadata:
      labels:
        app: ms-8086
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-8087