apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-85
  labels:
    app: ms-85
    dependency: ms-86
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-85
  template:
    metadata:
      labels:
        app: ms-85
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-86