apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-59
  labels:
    app: ms-59
    dependency: ms-60
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-59
  template:
    metadata:
      labels:
        app: ms-59
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-60