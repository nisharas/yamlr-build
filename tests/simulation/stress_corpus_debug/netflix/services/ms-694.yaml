apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-694
  labels:
    app: ms-694
    dependency: ms-695
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-694
  template:
    metadata:
      labels:
        app: ms-694
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-695