apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-1847
  labels:
    app: ms-1847
    dependency: ms-1848
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-1847
  template:
    metadata:
      labels:
        app: ms-1847
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-1848