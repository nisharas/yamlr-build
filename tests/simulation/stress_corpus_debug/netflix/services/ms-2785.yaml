apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-2785
  labels:
    app: ms-2785
    dependency: ms-2786
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-2785
  template:
    metadata:
      labels:
        app: ms-2785
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-2786