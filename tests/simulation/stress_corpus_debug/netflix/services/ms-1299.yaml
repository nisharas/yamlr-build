apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-1299
  labels:
    app: ms-1299
    dependency: ms-1300
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-1299
  template:
    metadata:
      labels:
        app: ms-1299
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-1300