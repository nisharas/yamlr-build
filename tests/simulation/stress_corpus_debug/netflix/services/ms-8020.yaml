apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-8020
  labels:
    app: ms-8020
    dependency: ms-8021
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-8020
  template:
    metadata:
      labels:
        app: ms-8020
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-8021