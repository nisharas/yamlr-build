apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-1815
  labels:
    app: ms-1815
    dependency: ms-1816
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-1815
  template:
    metadata:
      labels:
        app: ms-1815
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-1816