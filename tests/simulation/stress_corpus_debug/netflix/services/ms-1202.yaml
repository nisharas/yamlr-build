apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-1202
  labels:
    app: ms-1202
    dependency: ms-1203
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-1202
  template:
    metadata:
      labels:
        app: ms-1202
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-1203