apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-4096
  labels:
    app: ms-4096
    dependency: ms-4097
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-4096
  template:
    metadata:
      labels:
        app: ms-4096
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-4097