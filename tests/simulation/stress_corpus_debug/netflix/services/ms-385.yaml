apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-385
  labels:
    app: ms-385
    dependency: ms-386
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-385
  template:
    metadata:
      labels:
        app: ms-385
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-386