apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-1690
  labels:
    app: ms-1690
    dependency: ms-1691
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-1690
  template:
    metadata:
      labels:
        app: ms-1690
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-1691