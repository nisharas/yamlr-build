apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-35
  labels:
    app: ms-35
    dependency: ms-36
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-35
  template:
    metadata:
      labels:
        app: ms-35
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-36