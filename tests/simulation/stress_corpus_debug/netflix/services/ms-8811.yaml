apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-8811
  labels:
    app: ms-8811
    dependency: ms-8812
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-8811
  template:
    metadata:
      labels:
        app: ms-8811
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-8812