apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-3201
  labels:
    app: ms-3201
    dependency: ms-3202
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-3201
  template:
    metadata:
      labels:
        app: ms-3201
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-3202