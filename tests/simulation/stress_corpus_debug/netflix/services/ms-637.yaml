apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-637
  labels:
    app: ms-637
    dependency: ms-638
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-637
  template:
    metadata:
      labels:
        app: ms-637
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-638