apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-9409
  labels:
    app: ms-9409
    dependency: ms-9410
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-9409
  template:
    metadata:
      labels:
        app: ms-9409
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-9410