apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-8542
  labels:
    app: ms-8542
    dependency: ms-8543
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-8542
  template:
    metadata:
      labels:
        app: ms-8542
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-8543