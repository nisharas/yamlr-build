apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-8800
  labels:
    app: ms-8800
    dependency: ms-8801
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-8800
  template:
    metadata:
      labels:
        app: ms-8800
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-8801