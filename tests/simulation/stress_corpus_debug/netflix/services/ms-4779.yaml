apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-4779
  labels:
    app: ms-4779
    dependency: ms-4780
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-4779
  template:
    metadata:
      labels:
        app: ms-4779
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-4780