apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-9160
  labels:
    app: ms-9160
    dependency: ms-9161
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-9160
  template:
    metadata:
      labels:
        app: ms-9160
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-9161