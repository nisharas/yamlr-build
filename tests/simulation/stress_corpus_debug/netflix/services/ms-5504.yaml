apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-5504
  labels:
    app: ms-5504
    dependency: ms-5505
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-5504
  template:
    metadata:
      labels:
        app: ms-5504
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-5505