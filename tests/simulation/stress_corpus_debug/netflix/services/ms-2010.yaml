apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-2010
  labels:
    app: ms-2010
    dependency: ms-2011
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-2010
  template:
    metadata:
      labels:
        app: ms-2010
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-2011