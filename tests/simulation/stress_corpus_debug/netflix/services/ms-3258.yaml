apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-3258
  labels:
    app: ms-3258
    dependency: ms-3259
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-3258
  template:
    metadata:
      labels:
        app: ms-3258
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-3259