apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-4739
  labels:
    app: ms-4739
    dependency: ms-4740
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-4739
  template:
    metadata:
      labels:
        app: ms-4739
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-4740