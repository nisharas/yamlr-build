apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-1510
  labels:
    app: ms-1510
    dependency: ms-1511
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-1510
  template:
    metadata:
      labels:
        app: ms-1510
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-1511