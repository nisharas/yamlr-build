apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-661
  labels:
    app: ms-661
    dependency: ms-662
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-661
  template:
    metadata:
      labels:
        app: ms-661
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-662