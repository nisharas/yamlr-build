apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-86
  labels:
    app: ms-86
    dependency: ms-87
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-86
  template:
    metadata:
      labels:
        app: ms-86
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-87