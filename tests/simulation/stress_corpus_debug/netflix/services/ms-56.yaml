apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-56
  labels:
    app: ms-56
    dependency: ms-57
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-56
  template:
    metadata:
      labels:
        app: ms-56
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-57