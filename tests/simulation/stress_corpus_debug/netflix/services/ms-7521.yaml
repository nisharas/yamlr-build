apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-7521
  labels:
    app: ms-7521
    dependency: ms-7522
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-7521
  template:
    metadata:
      labels:
        app: ms-7521
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-7522