apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-641
  labels:
    app: ms-641
    dependency: ms-642
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-641
  template:
    metadata:
      labels:
        app: ms-641
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-642