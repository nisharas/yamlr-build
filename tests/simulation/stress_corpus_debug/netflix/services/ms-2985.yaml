apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-2985
  labels:
    app: ms-2985
    dependency: ms-2986
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-2985
  template:
    metadata:
      labels:
        app: ms-2985
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-2986