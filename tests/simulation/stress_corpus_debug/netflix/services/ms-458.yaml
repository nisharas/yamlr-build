apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-458
  labels:
    app: ms-458
    dependency: ms-459
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-458
  template:
    metadata:
      labels:
        app: ms-458
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-459