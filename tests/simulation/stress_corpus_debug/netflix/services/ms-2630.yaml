apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-2630
  labels:
    app: ms-2630
    dependency: ms-2631
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-2630
  template:
    metadata:
      labels:
        app: ms-2630
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-2631