apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-4172
  labels:
    app: ms-4172
    dependency: ms-4173
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-4172
  template:
    metadata:
      labels:
        app: ms-4172
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-4173