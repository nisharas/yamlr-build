apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-8170
  labels:
    app: ms-8170
    dependency: ms-8171
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-8170
  template:
    metadata:
      labels:
        app: ms-8170
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-8171