apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-1317
  labels:
    app: ms-1317
    dependency: ms-1318
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-1317
  template:
    metadata:
      labels:
        app: ms-1317
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-1318