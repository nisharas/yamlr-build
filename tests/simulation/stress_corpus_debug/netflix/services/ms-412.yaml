apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-412
  labels:
    app: ms-412
    dependency: ms-413
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-412
  template:
    metadata:
      labels:
        app: ms-412
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-413