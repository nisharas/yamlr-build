apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-4695
  labels:
    app: ms-4695
    dependency: ms-4696
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-4695
  template:
    metadata:
      labels:
        app: ms-4695
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-4696