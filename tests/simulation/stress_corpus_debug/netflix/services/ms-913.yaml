apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-913
  labels:
    app: ms-913
    dependency: ms-914
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-913
  template:
    metadata:
      labels:
        app: ms-913
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-914