apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-888
  labels:
    app: ms-888
    dependency: ms-889
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-888
  template:
    metadata:
      labels:
        app: ms-888
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-889