apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-856
  labels:
    app: ms-856
    dependency: ms-857
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-856
  template:
    metadata:
      labels:
        app: ms-856
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-857