apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-9009
  labels:
    app: ms-9009
    dependency: ms-9010
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-9009
  template:
    metadata:
      labels:
        app: ms-9009
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-9010