apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-750
  labels:
    app: ms-750
    dependency: ms-751
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-750
  template:
    metadata:
      labels:
        app: ms-750
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-751