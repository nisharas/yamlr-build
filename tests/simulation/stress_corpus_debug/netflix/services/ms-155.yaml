apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-155
  labels:
    app: ms-155
    dependency: ms-156
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-155
  template:
    metadata:
      labels:
        app: ms-155
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-156