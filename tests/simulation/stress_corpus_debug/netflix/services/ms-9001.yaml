apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-9001
  labels:
    app: ms-9001
    dependency: ms-9002
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-9001
  template:
    metadata:
      labels:
        app: ms-9001
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-9002