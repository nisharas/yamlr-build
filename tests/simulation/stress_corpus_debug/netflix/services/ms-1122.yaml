apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-1122
  labels:
    app: ms-1122
    dependency: ms-1123
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-1122
  template:
    metadata:
      labels:
        app: ms-1122
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-1123