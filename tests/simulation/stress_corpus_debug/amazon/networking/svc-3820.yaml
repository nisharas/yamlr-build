apiVersion: v1
kind: Service
metadata:
  name: aws-svc-3820
  namespace: us-east-1
spec:
  selector:
    app: aws-svc-3820
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aws-svc-3820-ingress
  namespace: us-east-1
spec:
  rules:
  - http:
      paths:
      - path: /api/3820
        pathType: Prefix
        backend:
          service:
            name: aws-svc-3820
            port:
              number: 80