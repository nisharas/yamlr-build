apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-647
  labels:
    app: ms-647
    dependency: ms-648
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-647
  template:
    metadata:
      labels:
        app: ms-647
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-648