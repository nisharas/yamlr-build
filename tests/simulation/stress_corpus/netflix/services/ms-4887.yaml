apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-4887
  labels:
    app: ms-4887
    dependency: ms-4888
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-4887
  template:
    metadata:
      labels:
        app: ms-4887
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-4888