apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-68
  labels:
    app: ms-68
    dependency: ms-69
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-68
  template:
    metadata:
      labels:
        app: ms-68
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-69