apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-718
  labels:
    app: ms-718
    dependency: ms-719
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-718
  template:
    metadata:
      labels:
        app: ms-718
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-719