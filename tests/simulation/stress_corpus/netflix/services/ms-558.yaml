apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-558
  labels:
    app: ms-558
    dependency: ms-559
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-558
  template:
    metadata:
      labels:
        app: ms-558
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-559