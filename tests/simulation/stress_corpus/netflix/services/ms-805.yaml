apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-805
  labels:
    app: ms-805
    dependency: ms-806
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-805
  template:
    metadata:
      labels:
        app: ms-805
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-806