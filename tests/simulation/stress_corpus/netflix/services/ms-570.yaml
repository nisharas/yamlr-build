apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-570
  labels:
    app: ms-570
    dependency: ms-571
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-570
  template:
    metadata:
      labels:
        app: ms-570
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-571