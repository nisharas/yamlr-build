apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-481
  labels:
    app: ms-481
    dependency: ms-482
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-481
  template:
    metadata:
      labels:
        app: ms-481
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-482