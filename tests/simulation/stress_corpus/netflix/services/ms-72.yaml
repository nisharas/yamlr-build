apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-72
  labels:
    app: ms-72
    dependency: ms-73
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-72
  template:
    metadata:
      labels:
        app: ms-72
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-73