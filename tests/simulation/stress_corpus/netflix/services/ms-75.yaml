apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-75
  labels:
    app: ms-75
    dependency: ms-76
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-75
  template:
    metadata:
      labels:
        app: ms-75
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-76