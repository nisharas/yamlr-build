apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-511
  labels:
    app: ms-511
    dependency: ms-512
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-511
  template:
    metadata:
      labels:
        app: ms-511
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-512