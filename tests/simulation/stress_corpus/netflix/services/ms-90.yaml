apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-90
  labels:
    app: ms-90
    dependency: ms-91
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-90
  template:
    metadata:
      labels:
        app: ms-90
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-91