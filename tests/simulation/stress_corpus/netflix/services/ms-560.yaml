apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-560
  labels:
    app: ms-560
    dependency: ms-561
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-560
  template:
    metadata:
      labels:
        app: ms-560
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-561