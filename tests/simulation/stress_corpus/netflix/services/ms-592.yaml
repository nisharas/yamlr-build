apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-592
  labels:
    app: ms-592
    dependency: ms-593
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-592
  template:
    metadata:
      labels:
        app: ms-592
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-593