apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-892
  labels:
    app: ms-892
    dependency: ms-893
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-892
  template:
    metadata:
      labels:
        app: ms-892
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-893