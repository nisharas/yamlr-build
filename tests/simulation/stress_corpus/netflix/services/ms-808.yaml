apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-808
  labels:
    app: ms-808
    dependency: ms-809
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-808
  template:
    metadata:
      labels:
        app: ms-808
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-809