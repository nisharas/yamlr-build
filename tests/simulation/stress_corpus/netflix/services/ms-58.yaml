apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-58
  labels:
    app: ms-58
    dependency: ms-59
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-58
  template:
    metadata:
      labels:
        app: ms-58
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-59