apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-704
  labels:
    app: ms-704
    dependency: ms-705
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-704
  template:
    metadata:
      labels:
        app: ms-704
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-705