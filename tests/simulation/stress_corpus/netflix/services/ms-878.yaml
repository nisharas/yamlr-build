apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-878
  labels:
    app: ms-878
    dependency: ms-879
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-878
  template:
    metadata:
      labels:
        app: ms-878
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-879