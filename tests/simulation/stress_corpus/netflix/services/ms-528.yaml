apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-528
  labels:
    app: ms-528
    dependency: ms-529
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-528
  template:
    metadata:
      labels:
        app: ms-528
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-529