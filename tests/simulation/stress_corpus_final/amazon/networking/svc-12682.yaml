apiVersion: v1
kind: Service
metadata:
  name: aws-svc-12682
  namespace: us-east-1
spec:
  selector:
    app: aws-svc-12682
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aws-svc-12682-ingress
  namespace: us-east-1
spec:
  rules:
  - http:
      paths:
      - path: /api/12682
        pathType: Prefix
        backend:
          service:
            name: aws-svc-12682
            port:
              number: 80