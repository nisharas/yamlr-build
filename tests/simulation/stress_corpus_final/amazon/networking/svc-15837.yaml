apiVersion: v1
kind: Service
metadata:
  name: aws-svc-15837
  namespace: us-east-1
spec:
  selector:
    app: aws-svc-15837
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aws-svc-15837-ingress
  namespace: us-east-1
spec:
  rules:
  - http:
      paths:
      - path: /api/15837
        pathType: Prefix
        backend:
          service:
            name: aws-svc-15837
            port:
              number: 80