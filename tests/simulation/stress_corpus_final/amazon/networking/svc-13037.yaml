apiVersion: v1
kind: Service
metadata:
  name: aws-svc-13037
  namespace: us-east-1
spec:
  selector:
    app: aws-svc-13037
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aws-svc-13037-ingress
  namespace: us-east-1
spec:
  rules:
  - http:
      paths:
      - path: /api/13037
        pathType: Prefix
        backend:
          service:
            name: aws-svc-13037
            port:
              number: 80