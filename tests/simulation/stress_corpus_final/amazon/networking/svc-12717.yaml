apiVersion: v1
kind: Service
metadata:
  name: aws-svc-12717
  namespace: us-east-1
spec:
  selector:
    app: aws-svc-12717
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aws-svc-12717-ingress
  namespace: us-east-1
spec:
  rules:
  - http:
      paths:
      - path: /api/12717
        pathType: Prefix
        backend:
          service:
            name: aws-svc-12717
            port:
              number: 80