apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-5716
  labels:
    app: ms-5716
    dependency: ms-5717
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-5716
  template:
    metadata:
      labels:
        app: ms-5716
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-5717