apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-991
  labels:
    app: ms-991
    dependency: ms-992
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-991
  template:
    metadata:
      labels:
        app: ms-991
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-992