apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-84
  labels:
    app: ms-84
    dependency: ms-85
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-84
  template:
    metadata:
      labels:
        app: ms-84
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-85