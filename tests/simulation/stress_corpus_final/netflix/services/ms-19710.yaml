apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-19710
  labels:
    app: ms-19710
    dependency: ms-19711
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-19710
  template:
    metadata:
      labels:
        app: ms-19710
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-19711