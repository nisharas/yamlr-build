apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-17264
  labels:
    app: ms-17264
    dependency: ms-17265
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-17264
  template:
    metadata:
      labels:
        app: ms-17264
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-17265