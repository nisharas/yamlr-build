apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-1301
  labels:
    app: ms-1301
    dependency: ms-1302
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-1301
  template:
    metadata:
      labels:
        app: ms-1301
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-1302