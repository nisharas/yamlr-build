apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-70
  labels:
    app: ms-70
    dependency: ms-71
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-70
  template:
    metadata:
      labels:
        app: ms-70
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-71