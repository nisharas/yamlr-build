apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-12520
  labels:
    app: ms-12520
    dependency: ms-12521
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-12520
  template:
    metadata:
      labels:
        app: ms-12520
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-12521