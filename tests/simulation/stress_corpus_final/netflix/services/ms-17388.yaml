apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-17388
  labels:
    app: ms-17388
    dependency: ms-17389
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-17388
  template:
    metadata:
      labels:
        app: ms-17388
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-17389