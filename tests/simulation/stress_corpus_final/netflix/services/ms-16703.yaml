apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-16703
  labels:
    app: ms-16703
    dependency: ms-16704
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-16703
  template:
    metadata:
      labels:
        app: ms-16703
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-16704