apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-12143
  labels:
    app: ms-12143
    dependency: ms-12144
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-12143
  template:
    metadata:
      labels:
        app: ms-12143
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-12144