apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-496
  labels:
    app: ms-496
    dependency: ms-497
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-496
  template:
    metadata:
      labels:
        app: ms-496
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-497