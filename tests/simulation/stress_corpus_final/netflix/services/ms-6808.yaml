apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-6808
  labels:
    app: ms-6808
    dependency: ms-6809
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-6808
  template:
    metadata:
      labels:
        app: ms-6808
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-6809