apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-813
  labels:
    app: ms-813
    dependency: ms-814
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-813
  template:
    metadata:
      labels:
        app: ms-813
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-814