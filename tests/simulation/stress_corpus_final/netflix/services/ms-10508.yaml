apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-10508
  labels:
    app: ms-10508
    dependency: ms-10509
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-10508
  template:
    metadata:
      labels:
        app: ms-10508
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-10509