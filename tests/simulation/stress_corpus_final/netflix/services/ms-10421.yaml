apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-10421
  labels:
    app: ms-10421
    dependency: ms-10422
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-10421
  template:
    metadata:
      labels:
        app: ms-10421
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-10422