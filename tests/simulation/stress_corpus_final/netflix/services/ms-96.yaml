apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-96
  labels:
    app: ms-96
    dependency: ms-97
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-96
  template:
    metadata:
      labels:
        app: ms-96
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-97