apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-824
  labels:
    app: ms-824
    dependency: ms-825
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-824
  template:
    metadata:
      labels:
        app: ms-824
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-825