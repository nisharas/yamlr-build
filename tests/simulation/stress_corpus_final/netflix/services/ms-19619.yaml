apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-19619
  labels:
    app: ms-19619
    dependency: ms-19620
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-19619
  template:
    metadata:
      labels:
        app: ms-19619
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-19620