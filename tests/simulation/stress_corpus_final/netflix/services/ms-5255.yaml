apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-5255
  labels:
    app: ms-5255
    dependency: ms-5256
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-5255
  template:
    metadata:
      labels:
        app: ms-5255
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-5256