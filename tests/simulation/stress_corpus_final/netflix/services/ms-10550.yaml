apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-10550
  labels:
    app: ms-10550
    dependency: ms-10551
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-10550
  template:
    metadata:
      labels:
        app: ms-10550
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-10551