apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-62
  labels:
    app: ms-62
    dependency: ms-63
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-62
  template:
    metadata:
      labels:
        app: ms-62
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-63