apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-15112
  labels:
    app: ms-15112
    dependency: ms-15113
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-15112
  template:
    metadata:
      labels:
        app: ms-15112
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-15113