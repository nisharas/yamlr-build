apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-731
  labels:
    app: ms-731
    dependency: ms-732
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-731
  template:
    metadata:
      labels:
        app: ms-731
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-732