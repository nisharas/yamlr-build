apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-5611
  labels:
    app: ms-5611
    dependency: ms-5612
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-5611
  template:
    metadata:
      labels:
        app: ms-5611
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-5612