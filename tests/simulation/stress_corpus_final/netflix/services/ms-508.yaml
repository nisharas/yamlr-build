apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-508
  labels:
    app: ms-508
    dependency: ms-509
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-508
  template:
    metadata:
      labels:
        app: ms-508
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-509