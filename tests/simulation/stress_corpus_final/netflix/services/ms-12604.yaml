apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-12604
  labels:
    app: ms-12604
    dependency: ms-12605
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-12604
  template:
    metadata:
      labels:
        app: ms-12604
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-12605