apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-1814
  labels:
    app: ms-1814
    dependency: ms-1815
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-1814
  template:
    metadata:
      labels:
        app: ms-1814
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-1815