apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-478
  labels:
    app: ms-478
    dependency: ms-479
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-478
  template:
    metadata:
      labels:
        app: ms-478
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-479