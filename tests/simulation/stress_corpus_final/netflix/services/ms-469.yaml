apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-469
  labels:
    app: ms-469
    dependency: ms-470
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-469
  template:
    metadata:
      labels:
        app: ms-469
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-470