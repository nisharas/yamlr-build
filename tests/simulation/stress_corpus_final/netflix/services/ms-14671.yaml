apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-14671
  labels:
    app: ms-14671
    dependency: ms-14672
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-14671
  template:
    metadata:
      labels:
        app: ms-14671
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-14672