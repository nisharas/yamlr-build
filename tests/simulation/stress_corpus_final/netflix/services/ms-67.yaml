apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-67
  labels:
    app: ms-67
    dependency: ms-68
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-67
  template:
    metadata:
      labels:
        app: ms-67
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-68