apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-2025
  labels:
    app: ms-2025
    dependency: ms-2026
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-2025
  template:
    metadata:
      labels:
        app: ms-2025
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-2026