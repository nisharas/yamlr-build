apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-3809
  labels:
    app: ms-3809
    dependency: ms-3810
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-3809
  template:
    metadata:
      labels:
        app: ms-3809
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-3810