apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-21
  labels:
    app: ms-21
    dependency: ms-22
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-21
  template:
    metadata:
      labels:
        app: ms-21
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-22