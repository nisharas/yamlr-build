apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-3803
  labels:
    app: ms-3803
    dependency: ms-3804
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-3803
  template:
    metadata:
      labels:
        app: ms-3803
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-3804