apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-10407
  labels:
    app: ms-10407
    dependency: ms-10408
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-10407
  template:
    metadata:
      labels:
        app: ms-10407
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-10408