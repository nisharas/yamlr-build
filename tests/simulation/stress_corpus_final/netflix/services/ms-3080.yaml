apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-3080
  labels:
    app: ms-3080
    dependency: ms-3081
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-3080
  template:
    metadata:
      labels:
        app: ms-3080
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-3081