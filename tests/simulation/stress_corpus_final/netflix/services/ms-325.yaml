apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-325
  labels:
    app: ms-325
    dependency: ms-326
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-325
  template:
    metadata:
      labels:
        app: ms-325
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-326