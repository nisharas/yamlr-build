apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-4704
  labels:
    app: ms-4704
    dependency: ms-4705
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-4704
  template:
    metadata:
      labels:
        app: ms-4704
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-4705