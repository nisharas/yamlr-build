apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-869
  labels:
    app: ms-869
    dependency: ms-870
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-869
  template:
    metadata:
      labels:
        app: ms-869
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-870