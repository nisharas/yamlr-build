apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-14453
  labels:
    app: ms-14453
    dependency: ms-14454
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-14453
  template:
    metadata:
      labels:
        app: ms-14453
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-14454