apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-695
  labels:
    app: ms-695
    dependency: ms-696
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-695
  template:
    metadata:
      labels:
        app: ms-695
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-696