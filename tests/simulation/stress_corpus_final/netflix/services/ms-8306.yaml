apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-8306
  labels:
    app: ms-8306
    dependency: ms-8307
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-8306
  template:
    metadata:
      labels:
        app: ms-8306
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-8307