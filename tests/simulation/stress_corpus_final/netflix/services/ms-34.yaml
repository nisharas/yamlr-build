apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-34
  labels:
    app: ms-34
    dependency: ms-35
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-34
  template:
    metadata:
      labels:
        app: ms-34
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-35