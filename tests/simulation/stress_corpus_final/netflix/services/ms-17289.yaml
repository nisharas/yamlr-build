apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-17289
  labels:
    app: ms-17289
    dependency: ms-17290
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-17289
  template:
    metadata:
      labels:
        app: ms-17289
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-17290