apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-10757
  labels:
    app: ms-10757
    dependency: ms-10758
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-10757
  template:
    metadata:
      labels:
        app: ms-10757
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-10758