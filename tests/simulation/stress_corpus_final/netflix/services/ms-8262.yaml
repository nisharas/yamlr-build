apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-8262
  labels:
    app: ms-8262
    dependency: ms-8263
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-8262
  template:
    metadata:
      labels:
        app: ms-8262
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-8263