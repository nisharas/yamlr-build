apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-437
  labels:
    app: ms-437
    dependency: ms-438
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-437
  template:
    metadata:
      labels:
        app: ms-437
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-438