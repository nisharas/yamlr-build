apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-10402
  labels:
    app: ms-10402
    dependency: ms-10403
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-10402
  template:
    metadata:
      labels:
        app: ms-10402
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-10403