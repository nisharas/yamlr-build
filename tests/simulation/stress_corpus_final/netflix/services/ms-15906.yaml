apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-15906
  labels:
    app: ms-15906
    dependency: ms-15907
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-15906
  template:
    metadata:
      labels:
        app: ms-15906
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-15907