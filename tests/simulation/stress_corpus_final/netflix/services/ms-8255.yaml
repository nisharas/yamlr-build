apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-8255
  labels:
    app: ms-8255
    dependency: ms-8256
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-8255
  template:
    metadata:
      labels:
        app: ms-8255
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-8256