apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-10008
  labels:
    app: ms-10008
    dependency: ms-10009
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-10008
  template:
    metadata:
      labels:
        app: ms-10008
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-10009