apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-3979
  labels:
    app: ms-3979
    dependency: ms-3980
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-3979
  template:
    metadata:
      labels:
        app: ms-3979
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-3980