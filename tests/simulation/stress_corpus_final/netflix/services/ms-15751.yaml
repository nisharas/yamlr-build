apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-15751
  labels:
    app: ms-15751
    dependency: ms-15752
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-15751
  template:
    metadata:
      labels:
        app: ms-15751
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-15752