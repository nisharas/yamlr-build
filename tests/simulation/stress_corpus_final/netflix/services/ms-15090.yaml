apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-15090
  labels:
    app: ms-15090
    dependency: ms-15091
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-15090
  template:
    metadata:
      labels:
        app: ms-15090
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-15091