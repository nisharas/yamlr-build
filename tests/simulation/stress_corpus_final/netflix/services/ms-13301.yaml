apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-13301
  labels:
    app: ms-13301
    dependency: ms-13302
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-13301
  template:
    metadata:
      labels:
        app: ms-13301
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-13302