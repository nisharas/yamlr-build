apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-242
  labels:
    app: ms-242
    dependency: ms-243
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-242
  template:
    metadata:
      labels:
        app: ms-242
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-243