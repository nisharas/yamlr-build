apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-8056
  labels:
    app: ms-8056
    dependency: ms-8057
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-8056
  template:
    metadata:
      labels:
        app: ms-8056
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-8057