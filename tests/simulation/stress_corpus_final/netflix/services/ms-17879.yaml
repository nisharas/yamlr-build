apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-17879
  labels:
    app: ms-17879
    dependency: ms-17880
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-17879
  template:
    metadata:
      labels:
        app: ms-17879
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-17880