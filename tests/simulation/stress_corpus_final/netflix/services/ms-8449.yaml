apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-8449
  labels:
    app: ms-8449
    dependency: ms-8450
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-8449
  template:
    metadata:
      labels:
        app: ms-8449
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-8450