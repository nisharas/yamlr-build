apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-79
  labels:
    app: ms-79
    dependency: ms-80
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-79
  template:
    metadata:
      labels:
        app: ms-79
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-80