apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-13505
  labels:
    app: ms-13505
    dependency: ms-13506
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-13505
  template:
    metadata:
      labels:
        app: ms-13505
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-13506