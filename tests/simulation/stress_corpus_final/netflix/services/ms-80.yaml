apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-80
  labels:
    app: ms-80
    dependency: ms-81
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-80
  template:
    metadata:
      labels:
        app: ms-80
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-81