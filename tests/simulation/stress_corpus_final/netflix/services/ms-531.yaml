apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-531
  labels:
    app: ms-531
    dependency: ms-532
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-531
  template:
    metadata:
      labels:
        app: ms-531
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-532