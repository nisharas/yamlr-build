apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-3506
  labels:
    app: ms-3506
    dependency: ms-3507
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-3506
  template:
    metadata:
      labels:
        app: ms-3506
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-3507