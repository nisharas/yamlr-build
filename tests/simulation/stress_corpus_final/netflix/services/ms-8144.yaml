apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-8144
  labels:
    app: ms-8144
    dependency: ms-8145
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-8144
  template:
    metadata:
      labels:
        app: ms-8144
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-8145