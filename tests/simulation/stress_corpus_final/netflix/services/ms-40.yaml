apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-40
  labels:
    app: ms-40
    dependency: ms-41
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-40
  template:
    metadata:
      labels:
        app: ms-40
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-41