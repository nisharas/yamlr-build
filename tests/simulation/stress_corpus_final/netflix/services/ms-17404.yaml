apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-17404
  labels:
    app: ms-17404
    dependency: ms-17405
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-17404
  template:
    metadata:
      labels:
        app: ms-17404
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-17405