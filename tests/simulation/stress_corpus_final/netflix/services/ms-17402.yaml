apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-17402
  labels:
    app: ms-17402
    dependency: ms-17403
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-17402
  template:
    metadata:
      labels:
        app: ms-17402
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-17403