apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-76
  labels:
    app: ms-76
    dependency: ms-77
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-76
  template:
    metadata:
      labels:
        app: ms-76
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-77