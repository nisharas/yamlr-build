apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-351
  labels:
    app: ms-351
    dependency: ms-352
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-351
  template:
    metadata:
      labels:
        app: ms-351
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-352