apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-606
  labels:
    app: ms-606
    dependency: ms-607
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-606
  template:
    metadata:
      labels:
        app: ms-606
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-607