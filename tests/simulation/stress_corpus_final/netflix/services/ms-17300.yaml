apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-17300
  labels:
    app: ms-17300
    dependency: ms-17301
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-17300
  template:
    metadata:
      labels:
        app: ms-17300
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-17301