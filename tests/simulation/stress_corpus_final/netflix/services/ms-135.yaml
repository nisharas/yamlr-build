apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-135
  labels:
    app: ms-135
    dependency: ms-136
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-135
  template:
    metadata:
      labels:
        app: ms-135
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-136