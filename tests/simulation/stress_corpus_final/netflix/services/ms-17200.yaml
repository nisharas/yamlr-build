apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-17200
  labels:
    app: ms-17200
    dependency: ms-17201
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-17200
  template:
    metadata:
      labels:
        app: ms-17200
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-17201