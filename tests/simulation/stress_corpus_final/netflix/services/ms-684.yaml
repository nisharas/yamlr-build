apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-684
  labels:
    app: ms-684
    dependency: ms-685
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-684
  template:
    metadata:
      labels:
        app: ms-684
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-685