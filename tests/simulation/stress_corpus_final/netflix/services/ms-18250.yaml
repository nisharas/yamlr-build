apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-18250
  labels:
    app: ms-18250
    dependency: ms-18251
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-18250
  template:
    metadata:
      labels:
        app: ms-18250
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-18251