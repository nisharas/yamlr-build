apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-204
  labels:
    app: ms-204
    dependency: ms-205
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-204
  template:
    metadata:
      labels:
        app: ms-204
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-205