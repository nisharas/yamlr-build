apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-417
  labels:
    app: ms-417
    dependency: ms-418
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-417
  template:
    metadata:
      labels:
        app: ms-417
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-418