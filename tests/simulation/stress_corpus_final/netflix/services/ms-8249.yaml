apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-8249
  labels:
    app: ms-8249
    dependency: ms-8250
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-8249
  template:
    metadata:
      labels:
        app: ms-8249
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-8250