apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-10292
  labels:
    app: ms-10292
    dependency: ms-10293
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-10292
  template:
    metadata:
      labels:
        app: ms-10292
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-10293