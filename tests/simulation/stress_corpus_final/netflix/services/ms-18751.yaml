apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-18751
  labels:
    app: ms-18751
    dependency: ms-18752
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-18751
  template:
    metadata:
      labels:
        app: ms-18751
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-18752