apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-129
  labels:
    app: ms-129
    dependency: ms-130
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-129
  template:
    metadata:
      labels:
        app: ms-129
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-130