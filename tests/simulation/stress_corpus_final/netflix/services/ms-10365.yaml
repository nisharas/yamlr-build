apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-10365
  labels:
    app: ms-10365
    dependency: ms-10366
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-10365
  template:
    metadata:
      labels:
        app: ms-10365
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-10366