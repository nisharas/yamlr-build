apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-19300
  labels:
    app: ms-19300
    dependency: ms-19301
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-19300
  template:
    metadata:
      labels:
        app: ms-19300
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-19301