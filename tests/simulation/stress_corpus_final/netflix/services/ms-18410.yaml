apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-18410
  labels:
    app: ms-18410
    dependency: ms-18411
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-18410
  template:
    metadata:
      labels:
        app: ms-18410
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-18411