apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-18803
  labels:
    app: ms-18803
    dependency: ms-18804
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-18803
  template:
    metadata:
      labels:
        app: ms-18803
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-18804