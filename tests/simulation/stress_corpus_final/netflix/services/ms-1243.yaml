apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-1243
  labels:
    app: ms-1243
    dependency: ms-1244
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-1243
  template:
    metadata:
      labels:
        app: ms-1243
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-1244