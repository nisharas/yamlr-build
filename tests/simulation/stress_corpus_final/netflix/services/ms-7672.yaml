apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-7672
  labels:
    app: ms-7672
    dependency: ms-7673
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-7672
  template:
    metadata:
      labels:
        app: ms-7672
    spec:
      containers:
      - name: main
        image: netflix/service:latest
        env:
        - name: TARGET_SERVICE
          value: ms-7673