name: Native Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on tags like v1.1.0

permissions:
  contents: read

concurrency:
  group: yamlr-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Release correctness gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  security-audit:
    name: Release security gate
    uses: ./.github/workflows/security_audit.yml
    permissions:
      contents: read

  build:
    name: Build Native Binaries
    needs: [validate, security-audit]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout Enterprise Codebase
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Set up Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache: false
          toolchain: 1.98.1
          override: true

      - name: Compile Standalone Rust Native Binary
        run: |
          cargo build --locked --release --bin yamlr --manifest-path native_core/Cargo.toml
          mkdir -p dist
          cargo install --locked --version 0.9.2 cargo-about
          cd native_core
          cargo about generate --locked --fail --no-default-features about.hbs > ../dist/THIRD_PARTY_NOTICES_RUST.txt
          cd ..
          mkdir -p src/yamlr/bin
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp native_core/target/release/yamlr.exe src/yamlr/bin/yamlr.exe
            python -c "import sys,zipfile; archive=zipfile.ZipFile(sys.argv[3], 'w', zipfile.ZIP_DEFLATED); archive.write(sys.argv[1], 'yamlr.exe'); archive.write(sys.argv[2], 'THIRD_PARTY_NOTICES_RUST.txt'); archive.close()" native_core/target/release/yamlr.exe dist/THIRD_PARTY_NOTICES_RUST.txt dist/yamlr-native-windows-x86_64.zip
          elif [ "$RUNNER_OS" = "macOS" ]; then
            cp native_core/target/release/yamlr src/yamlr/bin/yamlr
            ARCH="$(uname -m)"
            case "$ARCH" in
              arm64|aarch64) ARCH="aarch64" ;;
              x86_64|amd64) ARCH="x86_64" ;;
              *) echo "Unsupported macOS architecture: $ARCH" >&2; exit 1 ;;
            esac
            tar -czf "dist/yamlr-native-macos-${ARCH}.tar.gz" -C "$GITHUB_WORKSPACE/native_core/target/release" yamlr -C "$GITHUB_WORKSPACE" dist/THIRD_PARTY_NOTICES_RUST.txt
          else
            cp native_core/target/release/yamlr src/yamlr/bin/yamlr
            ARCH="$(uname -m)"
            case "$ARCH" in
              arm64|aarch64) ARCH="aarch64" ;;
              x86_64|amd64) ARCH="x86_64" ;;
              *) echo "Unsupported Linux architecture: $ARCH" >&2; exit 1 ;;
            esac
            tar -czf "dist/yamlr-native-linux-${ARCH}.tar.gz" -C "$GITHUB_WORKSPACE/native_core/target/release" yamlr -C "$GITHUB_WORKSPACE" dist/THIRD_PARTY_NOTICES_RUST.txt
          fi
        shell: bash

      - name: Smoke test standalone binary (Windows)
        if: runner.os == 'Windows'
        run: python scripts/ci/smoke_binary.py native_core/target/release/yamlr.exe

      - name: Smoke test standalone binary (Unix)
        if: runner.os != 'Windows'
        run: python scripts/ci/smoke_binary.py native_core/target/release/yamlr

      - name: Build Thin Python Wheel (Ruff Model)
        run: |
          python -m pip install pip==26.2.1 maturin==1.15.0 build==1.6.1 wheel==0.48.0
          python -m build --no-isolation --wheel --outdir dist/
        shell: bash

      - name: Install and smoke-test Python wheel
        run: |
          python -m pip install pip-licenses==5.5.5
          NATIVE_BIN="native_core/target/release/yamlr"
          if [ "$RUNNER_OS" = "Windows" ]; then NATIVE_BIN="${NATIVE_BIN}.exe"; fi
          python scripts/ci/smoke_wheel.py dist --native-bin "$NATIVE_BIN" --license-texts "dist/PYTHON_LICENSE_TEXTS-${{ runner.os }}-${{ runner.arch }}.txt" --license-inventory "dist/PYTHON_LICENSE_INVENTORY-${{ runner.os }}-${{ runner.arch }}.json"
        shell: bash

      - name: Give Rust notices a platform-specific release filename
        run: mv "dist/THIRD_PARTY_NOTICES_RUST.txt" "dist/THIRD_PARTY_NOTICES_RUST-${RUNNER_OS}-${RUNNER_ARCH}.txt"
        shell: bash

      - name: Generate dependency SBOM
        uses: anchore/sbom-action@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/yamlr-sbom-${{ runner.os }}-${{ runner.arch }}.cdx.json
          artifact-name: yamlr-sbom-${{ runner.os }}-${{ runner.arch }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Reject private keys in release artifacts
        run: python scripts/ci/check_release_artifacts.py dist

      - name: Upload Artifacts to Pipeline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yamlr-${{ runner.os }}-${{ runner.arch }}-build
          path: dist/*
          retention-days: 1

  publish:
    name: Push to Public Repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download all compiled artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: compiled_binaries

      - name: Collect release assets and generate checksums
        run: |
          mkdir -p release_assets
          find compiled_binaries -type f -exec cp {} release_assets/ \;
          for workspace in website vscode gateway; do
            test -s "release_assets/yamlr-third-party-js-${workspace}.zip"
          done
          cd release_assets
          for file in yamlr-*; do
            if [ -f "$file" ]; then sha256sum "$file" > "${file}.sha256"; fi
          done
          for file in yamlr-*; do
            if [ -f "$file" ] && [[ "$file" != *.sha256 ]]; then sha256sum "$file"; fi
          done > native-checksums.txt
          cp native-checksums.txt checksums.sha256
          ls -la

      - name: Attest release artifacts
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: 'release_assets/yamlr-native-*,release_assets/yamlr-*.whl,release_assets/yamlr-sbom-*.cdx.json,release_assets/yamlr-third-party-js-*.zip,scripts/install.sh,website/public/install.sh,website/public/install.ps1'

      - name: Publish to Public Hub
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release_assets/*
          repository: yamlr/yamlr
          token: ${{ secrets.PUBLIC_HUB_PAT }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

  docker_release:
    name: Build & Push Docker Image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: actions/scan/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/yamlr:latest
            ghcr.io/${{ github.repository }}/yamlr:${{ github.ref_name }}
