name: Release Standalone Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: yamlr-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Release correctness gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  security-audit:
    name: Release security gate
    uses: ./.github/workflows/security_audit.yml
    permissions:
      contents: read

  build-release:
    name: Build (${{ matrix.target }})
    needs: [validate, security-audit]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: yamlr
            asset_name: yamlr-linux-x86_64.tar.gz
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: yamlr
            asset_name: yamlr-linux-aarch64.tar.gz
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
            artifact_name: yamlr
            asset_name: yamlr-macos-x86_64.tar.gz
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: yamlr
            asset_name: yamlr-macos-aarch64.tar.gz
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: yamlr.exe
            asset_name: yamlr-windows-x86_64.zip
            use_cross: false

    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python for artifact checks
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.98.1
          target: ${{ matrix.target }}
          cache: false

      - name: Generate Rust dependency license notices
        run: |
          cargo install --locked --version 0.9.2 cargo-about
          cd native_core
          cargo about generate --locked --fail --no-default-features about.hbs > ../THIRD_PARTY_NOTICES_RUST.txt
        shell: bash

      - name: Install cross (for cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 88f49ff79e777bef6d3564531636ee4d3cc2f8d2 --locked

      - name: Build standalone binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --locked --manifest-path native_core/Cargo.toml --release --target ${{ matrix.target }} --bin yamlr
          else
            cargo build --locked --manifest-path native_core/Cargo.toml --release --target ${{ matrix.target }} --bin yamlr
          fi
        shell: bash

      - name: Smoke test standalone binary
        if: matrix.use_cross != true
        run: python scripts/ci/smoke_binary.py native_core/target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Smoke test cross-compiled standalone binary under QEMU
        if: matrix.use_cross == true
        run: |
          printf 'apiVersion: v1\nkind: Pod\nmetadata:\n  name: smoke\n' > native_core/target/smoke.yaml
          YAMLR_TELEMETRY=off cross run --locked --manifest-path native_core/Cargo.toml --release --target ${{ matrix.target }} --bin yamlr -- version --json
          YAMLR_TELEMETRY=off cross run --locked --manifest-path native_core/Cargo.toml --release --target ${{ matrix.target }} --bin yamlr -- scan native_core/target/smoke.yaml --output json --output-file native_core/target/report.json --exit-zero
          python -c "import json; report=json.load(open('native_core/target/report.json', encoding='utf-8')); assert isinstance(report, dict)"
        shell: bash

      - name: Generate dependency SBOM
        uses: anchore/sbom-action@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: yamlr-sbom-${{ matrix.target }}.cdx.json
          artifact-name: yamlr-sbom-${{ matrix.target }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf ${{ matrix.asset_name }} \
            -C "$GITHUB_WORKSPACE/native_core/target/${{ matrix.target }}/release" ${{ matrix.artifact_name }} \
            -C "$GITHUB_WORKSPACE" THIRD_PARTY_NOTICES_RUST.txt
          shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
        shell: bash

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          7z a ${{ matrix.asset_name }} native_core/target/${{ matrix.target }}/release/${{ matrix.artifact_name }} THIRD_PARTY_NOTICES_RUST.txt
          $hash = (Get-FileHash -Algorithm SHA256 ${{ matrix.asset_name }}).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.asset_name }}" | Out-File -FilePath "${{ matrix.asset_name }}.sha256" -Encoding ascii
        shell: pwsh

      - name: Reject private keys in release artifact
        run: python scripts/ci/check_release_artifacts.py ${{ matrix.asset_name }}

      - name: Upload binary asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
            yamlr-sbom-${{ matrix.target }}.cdx.json

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python for artifact checks
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Download all built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets

      - name: Consolidate SHA-256 Checksums
        run: |
          for workspace in website vscode gateway; do
            test -s "release-assets/javascript-license-inventory-${workspace}/yamlr-third-party-js-${workspace}.zip"
            cp "release-assets/javascript-license-inventory-${workspace}/yamlr-third-party-js-${workspace}.zip" release-assets/
          done
          find release-assets -mindepth 2 -type f -name "yamlr-sbom-*.cdx.json" -exec cp {} release-assets/ \;
          test "$(find release-assets -maxdepth 1 -type f -name 'yamlr-sbom-*.cdx.json' | wc -l)" -eq 5
          find release-assets -type f -name "*.sha256" -exec cat {} + > SHA256SUMS.txt
          find release-assets -maxdepth 1 -type f \( -name "yamlr-sbom-*.cdx.json" -o -name "yamlr-third-party-js-*.zip" \) -exec sha256sum {} + >> SHA256SUMS.txt
          cp SHA256SUMS.txt checksums.txt
          find release-assets -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} ./ \;
          find release-assets -maxdepth 1 -type f -name "yamlr-sbom-*.cdx.json" -exec cp {} ./ \;

      - name: Reject private keys in release artifacts
        run: python scripts/ci/check_release_artifacts.py release-assets yamlr-*.tar.gz yamlr-*.zip

      - name: Attest release archives
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: 'yamlr-*.tar.gz,yamlr-*.zip,yamlr-sbom-*.cdx.json,scripts/install.sh,website/public/install.sh,website/public/install.ps1'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            yamlr-*
            SHA256SUMS.txt
            checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
