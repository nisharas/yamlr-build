name: Yamlr Distribution Test

on:
  push:
    branches: [ main ]
permissions:
  contents: read

jobs:
  # 1. Exercise the checked-out composite action with the locally built binary.
  action-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: stable
          cache: false

      - name: Build local Yamlr binary for the explicit action fallback
        run: cargo build --locked --release --manifest-path native_core/Cargo.toml --bin yamlr

      - name: Dogfood Yamlr Action
        uses: ./
        with:
          command: scan
          path: .
          version: v0.1.0
          allow-local-fallback: 'true'

  # 2. Enterprise Stress Tests (GAUNTLET)
  stress-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache: false
          toolchain: stable
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install --editable ".[dev]" pytest-mock
      - name: Run Enterprise Stress Tests
        run: pytest tests/pro/test_stress_enterprise.py -v
