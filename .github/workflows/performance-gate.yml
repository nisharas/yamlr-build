name: Native CLI Performance Benchmark

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-native-cli:
    name: Benchmark native directory scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache: false
          toolchain: 1.98.1
          override: true

      - name: Build release CLI
        run: cargo build --locked --release --manifest-path native_core/Cargo.toml --bin yamlr

      - name: Benchmark representative directory scan
        env:
          YAMLR_TELEMETRY: off
          CI: "true"
        run: python scripts/ci/benchmark_cli.py --binary native_core/target/release/yamlr --output performance-results/scan-cli.json --files 250 --samples 7 --build-profile release

      - name: Measure CRD, multi-document, and healing acceptance
        env:
          YAMLR_TELEMETRY: off
          CI: "true"
        run: |
          python -m pip install PyYAML==6.0.3
          python scripts/ci/benchmark_workloads.py --binary native_core/target/release/yamlr --output performance-results/workloads.json --documents 250 --samples 31 --build-profile release

      - name: Add benchmark summary
        if: always() && hashFiles('performance-results/*.json') != ''
        run: cat performance-results/*.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw benchmark result
        if: always() && hashFiles('performance-results/*.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-cli-performance-${{ github.run_id }}
          path: performance-results/*.json
          retention-days: 90
