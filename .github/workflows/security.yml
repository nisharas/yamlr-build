name: Security Audit & Vulnerability Scanning

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Rust Dependencies Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache: false
          toolchain: stable
          override: true

      - name: Install cargo-audit
        run: cargo install --locked --version 0.22.2 cargo-audit

      - name: Run Cargo Audit
        run: |
          cd native_core
          cargo audit

  pip-audit:
    name: Python Dependencies Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache: false
          toolchain: stable
          override: true

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Run pip-audit
        run: |
          pip-audit --strict .
