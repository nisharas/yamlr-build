name: "Yamlr Manifest PR Audit"

on:
  pull_request:
    paths:
      - "**.yaml"
      - "**.yml"

permissions:
  contents: read

jobs:
  audit:
    name: "Audit & Diff Manifests"
    runs-on: ubuntu-latest
    outputs:
      sarif_artifact_id: ${{ steps.upload_sarif.outputs.artifact-id }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install Yamlr"
        run: python -m pip install yamlr==0.1.0

      - name: "Preview Auto-Remediation Diffs"
        id: diff_preview
        run: |
          echo "### 🔍 Proposed Manifest Corrections" >> $GITHUB_STEP_SUMMARY
          echo '```diff' >> $GITHUB_STEP_SUMMARY
          if yamlr diff --unified . >> $GITHUB_STEP_SUMMARY 2>&1; then
            diff_status=0
          else
            diff_status=$?
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ "$diff_status" -gt 1 ]; then
            echo "::error::Yamlr diff preview failed with exit code ${diff_status}."
            exit "$diff_status"
          fi

      - name: "Execute Schema & Integrity Scan"
        run: |
          yamlr scan . --output sarif --output-file results.sarif --fail-on error

      - name: "Save SARIF artifact"
        id: upload_sarif
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && hashFiles('results.sarif') != ''
        with:
          name: yamlr-pr-audit-sarif
          path: results.sarif
          if-no-files-found: error

  publish-sarif:
    needs: audit
    if: ${{ always() && needs.audit.outputs.sarif_artifact_id != '' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download SARIF artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: yamlr-pr-audit-sarif
          path: results

      - name: Upload SARIF Report to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: results/results.sarif
