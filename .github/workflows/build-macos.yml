name: Build Standalone macOS Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_name: yamlr-macos-aarch64.tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            asset_name: yamlr-macos-x86_64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: false

      - name: Build native release binary
        run: |
          cargo build --release --locked --manifest-path native_core/Cargo.toml --target ${{ matrix.target }} --bin yamlr

      - name: Package tarball and compute SHA-256
        run: |
          cd native_core/target/${{ matrix.target }}/release
          tar -czvf /tmp/${{ matrix.asset_name }} yamlr
          shasum -a 256 /tmp/${{ matrix.asset_name }} > /tmp/${{ matrix.asset_name }}.sha256
          cat /tmp/${{ matrix.asset_name }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: /tmp/${{ matrix.asset_name }}*
