name: Verify local Actions
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - name: Run Schema Compliance Gate
        run: |
          pip install -r requirements.txt
          python -m unittest tests/test_schema_compliance_unittest.py
      
      - name: Test Scan Action
        uses: ./.github/actions/scan
        with:
          path: 'tests/fixtures'
          args: '--harden'
          
      - name: Test Heal Action (Dry Run)
        uses: ./.github/actions/heal
        with:
          path: 'tests/fixtures'
          args: '--yes-all --no-backup --dry-run'
