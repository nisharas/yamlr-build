name: Yamlr Manifest Auto-Fix

on:
  schedule:
    - cron: '0 4 * * 1' # Weekly every Monday at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: stable
          cache: false

      - name: Install checked-out Yamlr
        run: |
          python -m pip install pip==26.2.1
          python -m pip install maturin==1.15.0
          python -m pip install --no-build-isolation --editable .

      - name: Run Yamlr Auto-Fix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "from yamlr.ci.autofix import execute_autofix; execute_autofix('.', create_pr=True)"
