name: Continuous Integration (CI)

on:
  workflow_call: {}
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  rust-license-policy:
    name: Rust Dependency License Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache: false
          toolchain: 1.98.1
          override: true

      - name: Install cargo-deny
        run: cargo install --locked --version 0.20.2 cargo-deny

      - name: Enforce allowed Rust dependency licenses
        run: cargo deny --manifest-path native_core/Cargo.toml --locked check licenses

      - name: Verify generated Rust dependency notices
        run: |
          cargo install --locked --version 0.9.2 cargo-about
          cd native_core
          cargo about generate --locked --fail --no-default-features about.hbs > ../THIRD_PARTY_NOTICES_RUST.txt
          test -s ../THIRD_PARTY_NOTICES_RUST.txt
        shell: bash

  javascript-license-policy:
    name: JavaScript Dependency License Inventory (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: website
            path: website
          - workspace: vscode
            path: vscode
          - workspace: gateway
            path: infra/gateway
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install locked dependencies
        working-directory: ${{ matrix.path }}
        run: npm ci

      - name: Audit locked JavaScript dependencies
        working-directory: ${{ matrix.path }}
        run: npm audit --audit-level=low

      - name: Verify optional gateway adapters
        if: matrix.workspace == 'gateway'
        working-directory: infra/gateway
        run: |
          npm test
          npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,DOM --allowImportingTsExtensions src/index.ts src/node_server.ts src/sqlite_storage.ts

      - name: Create production dependency license inventory and save notices
        working-directory: ${{ matrix.path }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/license-inventory/${{ matrix.workspace }}"
          npx --yes --package=license-checker-rseidelsohn@5.0.1 -- \
            license-checker-rseidelsohn \
            --production \
            --json \
            --out "$GITHUB_WORKSPACE/license-inventory/${{ matrix.workspace }}/licenses.json" \
            --files "$GITHUB_WORKSPACE/license-inventory/${{ matrix.workspace }}/license-texts"

      - name: Enforce production dependency license policy
        working-directory: ${{ matrix.path }}
        run: |
          npx --yes --package=license-checker-rseidelsohn@5.0.1 -- \
            license-checker-rseidelsohn \
            --production \
            --onlyAllow "0BSD;Apache-2.0;BSD-2-Clause;BSD-3-Clause;BlueOak-1.0.0;CC-BY-4.0;CC0-1.0;ISC;MIT;MIT OR Apache-2.0;MIT OR CC0-1.0;Python-2.0;Unlicense"

      - name: Package JavaScript license inventory and notices
        if: success()
        run: |
          cd "$GITHUB_WORKSPACE/license-inventory"
          zip -qr "$GITHUB_WORKSPACE/yamlr-third-party-js-${{ matrix.workspace }}.zip" "${{ matrix.workspace }}"

      - name: Upload JavaScript license inventory and notices
        if: success() && hashFiles(format('yamlr-third-party-js-{0}.zip', matrix.workspace)) != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: javascript-license-inventory-${{ matrix.workspace }}
          path: yamlr-third-party-js-${{ matrix.workspace }}.zip
          if-no-files-found: error

  rust-tests:
    name: Rust Native Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache: false
          toolchain: 1.98.1
          components: clippy, rustfmt
          override: true

      - name: Check Rust formatting
        run: cargo fmt --manifest-path native_core/Cargo.toml --all -- --check

      - name: Run Cargo Test
        run: |
          cd native_core
          cargo test --features python

      - name: Run Cargo Clippy
        run: |
          cd native_core
          cargo clippy --features python -- -D warnings

  python-tests:
    name: Python Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache: false
          toolchain: 1.98.1
          override: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install --editable ".[dev]"

      - name: Run Pytest
        run: |
          pytest tests/ -x --tb=short
        env:
          YAMLR_K8S_VERSION: "v1.30"

  python-rust-cli-parity:
    name: Python and Rust CLI Contract Parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache: false
          toolchain: 1.98.1
          override: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Python package and native extension
        run: python -m pip install --editable ".[dev]"

      - name: Build standalone Rust CLI
        run: cargo build --locked --manifest-path native_core/Cargo.toml --bin yamlr

      - name: Compare shared CLI behavior
        run: python tests/verify_rust_parity.py --native-bin native_core/target/debug/yamlr
        env:
          YAMLR_TELEMETRY: "off"
          CI: "true"

      - name: Validate native report serializers against the official SARIF schema
        run: python scripts/ci/verify_report_contracts.py

  python-wheel-smoke:
    name: Clean Python Wheel Smoke Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache: false
          toolchain: 1.98.1

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build Python wheel
        run: |
          python -m pip install pip==26.2.1 maturin==1.15.0 build==1.6.1
          python -m build --no-isolation --wheel --outdir wheel-dist

      - name: Build reference CLI for installed-wheel parity
        run: cargo build --locked --manifest-path native_core/Cargo.toml --bin yamlr

      - name: Install wheel in a clean environment and verify CLI/API/parity
        run: python scripts/ci/smoke_wheel.py wheel-dist --native-bin native_core/target/debug/yamlr

  golden-corpus:
    name: Golden Corpus Invariant Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache: false
          toolchain: 1.98.1
          override: true

      - name: Verify Golden Invariants
        run: |
          cd native_core
          cargo test --test golden_corpus_invariants

  cli-smoke-test:
    name: CLI Integration Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache: false
          toolchain: 1.98.1
          override: true

      - name: Build Native Standalone Binary
        run: |
          cd native_core
          cargo build --release --bin yamlr

      - name: Run Diagnostic Self-Test
        run: |
          ./native_core/target/release/yamlr version
          ./native_core/target/release/yamlr doctor
