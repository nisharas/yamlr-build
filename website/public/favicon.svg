<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800');
      .bg { fill: #0D1117; }
      .text-y { font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; fill: #F8FAFC; }
      .dot { fill: #10B981; }

      @media (prefers-color-scheme: light) {
        .bg { fill: #FFFFFF; }
        .text-y { fill: #0F172A; }
        .dot { fill: #059669; }
      }
    </style>
  </defs>
  <rect width="128" height="128" rx="28" class="bg"/>
  <text x="22" y="102" font-size="112" class="text-y">y</text>
  <circle cx="98" cy="96" r="13" class="dot"/>
</svg>
