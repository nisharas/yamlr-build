[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "yamlr"
version = "0.1.0"
description = "yamlr — Kubernetes manifest safety & healing engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "Nishar A Sunkesala", email = "maintainers@yamlr.dev"}
]
keywords = ["kubernetes", "yaml", "devops", "sre", "yamlr", "manifest-healing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
]

# External Dependencies
dependencies = [
    "ruamel.yaml==0.19.1",
    "rich>=14.3.3",
    "jsonschema>=4.26.0",
    "PyYAML>=6.0.3",
    "reportlab>=4.4.10",
    "pydantic>=2.12.5",
    "portalocker>=2.8.2",
    "PyJWT>=2.10.1",
    "cryptography>=44.0.1",
    "joblib>=1.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "mypy>=1.0",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
    "myst-parser>=2.0",
    "pylint>=3.0",
]
build = ["pyinstaller>=6.4.0"]

[tool.pylint.messages_control]
# Only enable logging-related checks for now to avoid noise.
# W1203: logging-fstring-interpolation — use lazy % formatting
# W1201: logging-not-lazy — string concatenation in logger (logger.debug("..." + var))
enable = ["W1203", "W1201"]
disable = ["all"]

[tool.pylint.logging]
logging-format-style = "old"


# Standard Entry Point
[project.scripts]
yamlr = "yamlr.cli.main:main"

[project.urls]
Homepage = "https://yamlr.dev"
Issues = "https://github.com/yamlr-dev/yamlr/issues"
Repository = "https://github.com/yamlr-dev/yamlr.git"

# --- SETUPTOOLS CONFIGURATION ---
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
# Explicitly exclude pro modules from OSS builds
# This ensures "src/yamlr/pro" is not packaged in the OSS wheel
exclude = ["tests*", "catalog*", "yamlr.pro*"]
namespaces = true

[tool.setuptools.package-data]
# Include the K8s catalogs in the distribution
yamlr = ["catalog/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py", "verify_*.py"]

[tool.maturin]
python-source = "src"
module-name = "yamlr_native"
manifest-path = "src/yamlr_native/Cargo.toml"
features = ["pyo3/extension-module"]
