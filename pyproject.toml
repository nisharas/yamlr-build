[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "yamlr"
version = "0.1.0"
description = "yamlr — Kubernetes manifest safety & healing engine (Python SDK & Automation Plane)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "Timonel Labs", email = "contact@yamlr.dev"}
]
keywords = ["kubernetes", "yaml", "devops", "sre", "yamlr", "manifest-healing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
]

# External Dependencies
dependencies = [
    "ruamel.yaml==0.19.1",
    "rich==14.3.3",
    "jsonschema==4.26.0",
    "PyYAML==6.0.3",
    "pydantic==2.12.5",
    "portalocker==2.8.2",
    "PyJWT==2.10.1",
    "cryptography==44.0.1",
    "joblib==1.3.2",
    "keyring==25.6.0",
    "mcp>=0.9.1",
]

[project.optional-dependencies]
reporting = ["reportlab==4.4.10"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "mypy>=1.0",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
    "myst-parser>=2.0",
    "pylint>=3.0",
]
build = ["pyinstaller>=6.4.0"]

[tool.pylint.messages_control]
# Only enable logging-related checks for now to avoid noise.
# W1203: logging-fstring-interpolation — use lazy % formatting
# W1201: logging-not-lazy — string concatenation in logger (logger.debug("..." + var))
enable = ["W1203", "W1201"]
disable = ["all"]

[tool.pylint.logging]
logging-format-style = "old"


# Standard Entry Point (Ruff-style thin wrapper delegating to native Rust binary)
[project.scripts]
yamlr = "yamlr.__main__:cli"

[project.urls]
Homepage = "https://yamlr.dev"
Issues = "https://github.com/yamlr-dev/yamlr/issues"
Repository = "https://github.com/yamlr-dev/yamlr.git"

# --- SETUPTOOLS CONFIGURATION ---
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
# Explicitly exclude pro and archived modules from distribution builds
# This ensures legacy Python code is not packaged in the wheel
exclude = ["tests*", "catalog*", "yamlr.pro*", "yamlr._archive*"]
namespaces = true

[tool.setuptools.package-data]
# Include the K8s catalogs, type hints, and bundled native binary in the distribution
yamlr = ["catalog/*.json", "py.typed", "bin/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py", "verify_*.py"]

[tool.maturin]
module-name = "yamlr_native"
manifest-path = "native_core/Cargo.toml"
features = ["python", "pyo3/extension-module"]
python-source = "src"
python-packages = ["yamlr", "yamlr_native"]
exclude = ["yamlr/_archive/**"]
