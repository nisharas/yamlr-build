- id: yamlr-scan
  name: Yamlr Scan
  description: Fast, semantic Kubernetes manifest auditor.
  entry: yamlr scan
  language: python
  files: \.(yaml|yml)$
  args: ["--output=text"]
- id: yamlr-check
  name: Yamlr Check
  description: Ultra-fast syntax validation (no network).
  entry: yamlr check
  language: python
  files: \.(yaml|yml)$
  args: ["--output=text"]
- id: yamlr-heal
  name: Yamlr Heal (Dry-run)
  description: Proactive manifest repair (S1 Preview).
  entry: yamlr heal
  language: python
  files: \.(yaml|yml)$
  args: ["--quiet", "--dry-run"]
- id: yamlr-migrate
  name: Yamlr Migrate (Dry-run)
  description: API deprecation migration (S1 Preview).
  entry: yamlr migrate
  language: python
  files: \.(yaml|yml)$
  args: ["--quiet", "--dry-run"]
