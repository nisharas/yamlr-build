apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - plugin.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: argocd-repo-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-repo-server
      spec:
        template:
          spec:
            containers:
              - name: yamlr-cmp-sidecar
                image: ghcr.io/yamlr/yamlr:latest
                command: [/var/run/argocd/argocd-cmp-server]
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 999
                volumeMounts:
                  - mountPath: /var/run/argocd
                    name: var-files
                  - mountPath: /home/argocd/cmp-server/plugins
                    name: plugins
                  - mountPath: /tmp
                    name: tmp
            volumes:
              - name: plugins
                emptyDir: {}
