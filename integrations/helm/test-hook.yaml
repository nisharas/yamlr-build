apiVersion: batch/v1
kind: Job
metadata:
  name: yamlr-helm-test
  annotations:
    "helm.sh/hook": test
spec:
  template:
    spec:
      containers:
        - name: yamlr-audit
          image: python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - pip install yamlr && yamlr scan . --fail-on error
      restartPolicy: Never
