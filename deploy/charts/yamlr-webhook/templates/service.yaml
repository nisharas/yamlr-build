apiVersion: v1
kind: Service
metadata:
  name: {{ include "yamlr-webhook.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "yamlr-webhook.name" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: https
  selector:
    app.kubernetes.io/name: {{ include "yamlr-webhook.name" . }}
