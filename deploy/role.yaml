apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: yamlr-resource-viewer
  namespace: default
  labels:
    app.kubernetes.io/managed-by: yamlr
rules:
- apiGroups: ["", "apps", "networking.k8s.io"]
  resources: ["pods", "deployments", "services", "ingresses", "configmaps", "secrets"]
  verbs: ["get", "list"]
