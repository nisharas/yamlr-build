syntax = "proto3";

package yamlr.v1;

option go_package = "github.com/yamlr/yamlr/proto/v1;yamlrv1";
option java_package = "dev.yamlr.v1";

// Universal manifest validation and healing service for cloud-agnostic platforms.
service ManifestService {
  // Scans a manifest document for schema, security, and integrity violations
  rpc ScanDocument(ScanDocumentRequest) returns (ScanDocumentResponse);

  // Surgically heals identified violations while preserving comments and formatting
  rpc HealDocument(HealDocumentRequest) returns (HealDocumentResponse);

  // Bi-directional streaming validation for large manifest pipelines
  rpc StreamValidate(stream DocumentChunk) returns (stream ValidationEvent);
}

message ScanDocumentRequest {
  string content = 1;
  string file_path = 2;
  string target_k8s_version = 3;
}

message ScanDocumentResponse {
  string status = 1;
  int32 total_violations = 2;
  repeated ViolationRecord violations = 3;
  float health_score = 4;
  int64 duration_ms = 5;
}

message HealDocumentRequest {
  string content = 1;
  string file_path = 2;
  string target_k8s_version = 3;
  bool dry_run = 4;
}

message HealDocumentResponse {
  string healed_content = 1;
  bool mutated = 2;
  repeated SuggestedFix applied_fixes = 3;
  string unified_diff = 4;
  int64 duration_ms = 5;
}

message DocumentChunk {
  string chunk_id = 1;
  bytes payload = 2;
  bool is_last = 3;
}

message ValidationEvent {
  string event_type = 1;
  ViolationRecord violation = 2;
}

message ViolationRecord {
  string rule_id = 1;
  string check_type = 2;
  string severity = 3;
  string message = 4;
  string field_path = 5;
  int32 line_number = 6;
  string help_uri = 7;
}

message SuggestedFix {
  string rule_id = 1;
  string description = 2;
  string field_path = 3;
  string original_text = 4;
  string replacement_text = 5;
}
