[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "yamlr-native"
version = "0.1.0"
description = "High-performance native acceleration for Yamlr core."
requires-python = ">=3.10"
authors = [
  { name = "Yamlr Team" }
]

[tool.maturin]
module-name = "yamlr_native"
features = ["python", "pyo3/extension-module"]

