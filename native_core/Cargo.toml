[package]
name = "yamlr-native"
version = "0.1.0"
edition = "2021"
authors = ["Yamlr Team"]
description = "High-performance native acceleration for Yamlr core."
license = "LicenseRef-Proprietary"

[lib]
name = "yamlr_native"
crate-type = ["cdylib", "rlib", "staticlib"]

[[bin]]
name = "yamlr"
path = "src/bin/main.rs"

[features]
default = []
python = ["pyo3"]
wasm = ["wasm-bindgen"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310", "macros"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = { package = "serde_yml", version = "0.0.12" }
serde_json = "1.0"
clap = { version = "4.6.6", default-features = false, features = ["std", "help", "usage", "error-context"] }
chrono = "0.4"
walkdir = "2.3"
regex = "1.7"
rayon = "1.7"
lazy_static = "1.4"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.3", features = ["v4", "js"] }
dirs = "5.0"
hmac = "0.12"
rand = "0.8"
flate2 = "1.0"
tar = "0.4"
tracing = "0.1"
zstd = "0.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jsonwebtoken = "9.2"
ureq = { version = "2.12.1", features = ["json"] }
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1.15"
pem = "3.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
tempfile = "3.8"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.11.0"

[[bench]]
name = "sharder_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
