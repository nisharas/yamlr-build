# Yamlr SHIELD ENGINE Ruleset
# Version: 1.0 (Forensic Sovereign)

rules:
  - id: SHD-001
    name: Unsafe HostPath
    severity: CRITICAL
    category: SECURITY
    description: Detects hostPath mounts which bypass container isolation.
  - id: SHD-002
    name: Privileged Container
    severity: CRITICAL
    category: SECURITY
    description: Detects containers running with administrative privileges.
  - id: SHD-003
    name: Sensitive Volume Exposure
    severity: WARNING
    category: DATA
    description: Detects sensitive volumes (Secrets/ConfigMaps) co-located with HostPath mounts.
  - id: SHD-004
    name: Host Network
    severity: WARNING
    category: SECURITY
    description: Detects pods sharing the host's network stack.
  - id: SHD-005
    name: Resource Starvation
    severity: WARNING
    category: RESOURCE
    description: Detects high-impact workloads lacking CPU/Memory limits.
  - id: SHD-006
    name: Circular Dependency
    severity: WARNING
    category: DATA
    description: Detects topological cycles that may cause deployment deadlocks.
  - id: SHD-007
    name: Network Isolation
    severity: WARNING
    category: NETWORK_ISOLATION
    description: Detects workloads in namespaces without default-deny NetworkPolicies.
  - id: SHD-008
    name: Orphan Bloat
    severity: INFO
    category: ORPHAN
    description: Detects sensitive resources (Secrets/CMs) with no active dependents.
  - id: SHD-009
    name: High Impact Density
    severity: INFO
    category: AVAILABILITY
    description: Detects resources that affect a significant percentage of the cluster.
  - id: SHD-010
    name: RBAC Escalation
    severity: CRITICAL
    category: RBAC
    description: Detects ClusterRoleBindings granting cluster-admin privileges.
  - id: SHD-011
    name: Zombie API
    severity: WARNING
    category: VERSION
    description: Detects usage of deprecated or removed 'Zombie' API versions.
  - id: SHD-012
    name: Disruption Blind-Spot
    severity: WARNING
    category: DISRUPTION
    description: Detects high-impact workloads lacking PodDisruptionBudgets.
  - id: SHD-013
    name: Ingress Hijack
    severity: WARNING
    category: TRAFFIC
    description: Detects host collision in Ingress resources which may lead to traffic hijacking.
  - id: SHD-014
    name: HPA Replica Conflict
    severity: WARNING
    category: REPLICA
    description: Detects static replica counts that conflict with HorizontalPodAutoscalers.
  - id: SHD-015
    name: CRD Version Drift
    severity: WARNING
    category: CRD
    description: Detects Custom Resources using versions not supported by the parent CRD.
  - id: SHD-016
    name: Root Execution Risk
    severity: CRITICAL
    category: SECURITY
    description: Detects containers running as root (runAsUser: 0 or runAsNonRoot: false).
