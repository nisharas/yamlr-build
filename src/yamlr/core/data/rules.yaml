"rule/no-latest-tag":
  name: "Avoid Latest Tag"
  severity: "Warning"
  description: "Container images should use immutable version tags or digests instead of 'latest'."
  rationale: "Using 'latest' makes deployments non-deterministic and rollbacks unreliable because the tag can point to different image builds over time."
  remediation: "Pin the image to a specific SHA digest or version tag (for example, 'nginx:1.25.3' or 'nginx@sha256:<digest>')."
  impact_description: "Non-deterministic deployments: rolling back may unintentionally deploy the latest image instead of the known stable one, causing production drift."
  risk_level: "Medium"
  external_url: "https://kubernetes.io/docs/concepts/configuration/overview/#container-images"
  example: |
    # Bad: uses the moving 'latest' tag
    containers:
      - name: web
        image: nginx:latest
    # Good: pinned version
    containers:
      - name: web
        image: nginx:1.25.3

"rule/resource-requests":
  name: "Resource Requests Missing"
  severity: "Warning"
  description: "Containers should define CPU and memory resource requests."
  rationale: "Requests guide the scheduler to place Pods on nodes with enough capacity, reducing unexpected OOM kills and node pressure."
  remediation: "Add 'resources.requests' with both 'cpu' and 'memory' values sized for normal load."
  impact_description: "Resource starvation or poor pod placement: the Kubernetes scheduler has no guarantee of resource availability, leading to unschedulable pods or performance degradation."
  risk_level: "High"
  external_url: "https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/"
  example: |
    # Missing requests (scheduler has no guarantee)
    containers:
      - name: api
        image: my-api:1.0.0
    # With CPU and memory requests
      - name: api
        image: my-api:1.0.0
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"

"rule/resource-limits":
  name: "Resource Limits Missing"
  severity: "Warning"
  description: "Containers should define CPU and memory resource limits."
  rationale: "Without limits, a single container can consume all node resources, causing performance issues or outages for other Pods."
  remediation: "Add 'resources.limits' with 'cpu' and 'memory' values that cap worst-case usage."
  impact_description: "Cluster instability: a single pod can consume 100% of node resources, triggering OOM kills across unrelated pods and degrading node responsiveness."
  risk_level: "High"
  external_url: "https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/"
  example: |
    # No limits (container can starve neighbors)
    containers:
      - name: worker
        image: my-worker:1.0.0
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
    # With limits
      - name: worker
        image: my-worker:1.0.0
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"

"rule/run-as-root":
  name: "Container Runs as Root"
  severity: "High"
  description: "Containers should run as a non-root user."
  rationale: "Root containers increase the impact of a breakout and may be blocked by cluster Pod Security settings."
  remediation: "Set 'securityContext.runAsNonRoot: true' at the Pod or Container level."
  impact_description: "Root-level breakout: an attacker who compromises the container can escape to the host with root privileges, potentially taking control of the entire node."
  risk_level: "High"
  external_url: "https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted"
  example: |
    # Risky: no securityContext, likely runs as root
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: api
    spec:
      template:
        spec:
          containers:
            - name: api
              image: my-api:1.0.0
    # Safer: enforce non-root user
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: api
    spec:
      template:
        spec:
          securityContext:
            runAsNonRoot: true
          containers:
            - name: api
              image: my-api:1.0.0

"rule/privileged-container":
  name: "Privileged Container"
  severity: "Critical"
  description: "Containers should not run in privileged mode."
  rationale: "Privileged containers effectively bypass most isolation and can access the host, which is rarely required for application workloads."
  remediation: "Set 'securityContext.privileged: false' or remove the field, and use specific capabilities or host access only when strictly necessary."
  impact_description: "Total node compromise: privileged containers have full access to the host kernel and underlying hardware, making pod isolation practically non-existent."
  risk_level: "Critical"
  external_url: "https://kubernetes.io/docs/concepts/security/pod-security-standards/#privileged"
  example: |
    # Bad: privileged container
    containers:
      - name: agent
        image: debug-tool:latest
        securityContext:
          privileged: true
    # Better: drop privileged, add only needed capabilities
      - name: agent
        image: debug-tool:latest
        securityContext:
          privileged: false
          capabilities:
            add: ["NET_ADMIN"]

"rule/missing-liveness":
  name: "Missing Liveness Probe"
  severity: "Warning"
  description: "Containers should define a livenessProbe."
  rationale: "Liveness probes tell Kubernetes when to restart a container; without one, a deadlocked or stuck process can remain running indefinitely."
  remediation: "Add a 'livenessProbe' (httpGet, exec, or tcpSocket) to the container spec."
  impact_description: "Zombie processes: unresponsive containers remain in the Pod, consuming resources without serving traffic, eventually leading to cascading failures."
  risk_level: "Medium"
  external_url: "https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/"
  example: |
    # No livenessProbe: stuck processes are not restarted
    containers:
      - name: api
        image: my-api:1.0.0
    # With livenessProbe
      - name: api
        image: my-api:1.0.0
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15

"rule/missing-readiness":
  name: "Missing Readiness Probe"
  severity: "Warning"
  description: "Containers should define a readinessProbe."
  rationale: "Readiness probes tell Kubernetes when a container is ready to receive traffic; without one, traffic may be sent to containers that are still initializing, causing 503 responses."
  remediation: "Add a 'readinessProbe' to the container spec that reflects application startup and warmup."
  impact_description: "Service unavailability: load balancers send traffic to pods that are not yet initialized, resulting in elevated error rates (503s) during scaling or rollouts."
  risk_level: "Medium"
  external_url: "https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/"
  example: |
    # No readinessProbe: traffic may hit before app is ready
    containers:
      - name: web
        image: my-web:1.0.0
    # With readinessProbe
      - name: web
        image: my-web:1.0.0
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10

"rule/ghost-service":
  name: "Ghost Service"
  severity: "Warning"
  description: "A Service exists but its selector matches no Pods."
  rationale: "The Service becomes a dead end for traffic, usually due to a typo in selector labels or a missing workload."
  remediation: "Verify 'service.spec.selector' matches the 'metadata.labels' in your Deployment or Pod template."
  impact_description: "Traffic routed to this Service will have no destination, leading to 'No endpoints available' errors for clients and broken application connectivity."
  risk_level: "Medium"
  external_url: "https://kubernetes.io/docs/concepts/services-networking/service/#defining-a-service"
  example: |
    # Service selector does not match Deployment labels -> ghost service
    apiVersion: v1
    kind: Service
    metadata:
      name: api
    spec:
      selector:
        app: api        # Expects 'app=api'
      ports:
        - port: 80
          targetPort: 8080
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: api
    spec:
      template:
        metadata:
          labels:
            app: api-v2  # Mismatch: 'api-v2' != 'api'

"rule/orphan-resource":
  name: "Orphan Config/Secret"
  severity: "Info"
  description: "A ConfigMap or Secret exists but is not referenced by any workload."
  rationale: "Orphan resources clutter the namespace and increase risk if sensitive data is kept around unnecessarily."
  remediation: "Delete the resource if it is unused, or reference it from workloads via 'envFrom' or 'volumes' if it should be in use."
  impact_description: "Namespace clutter — Secret or ConfigMap is not referenced by any workload, increasing the potential blast radius of a credential leak."
  risk_level: "Low"
  example: |
    # Orphan ConfigMap: defined but not used by any Pod
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: unused-config
    data:
      LOG_LEVEL: debug
    # Referenced ConfigMap: used by a Deployment
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: api
    spec:
      template:
        spec:
          containers:
            - name: api
              image: my-api:1.0.0
              envFrom:
                - configMapRef:
                    name: unused-config

"rule/broken-volume":
  name: "Broken Volume Reference"
  severity: "Error"
  description: "A Pod references a PersistentVolumeClaim (PVC) that does not exist in the workspace."
  rationale: "The Pod will remain Pending because the required storage cannot be mounted."
  remediation: "Add the missing PVC manifest to your project or fix the typo in 'volumes[].persistentVolumeClaim.claimName'."
  impact_description: "Deployment failure: the Pod will never start, remaining in 'Pending' state indefinitely, leading to a total service outage for that component."
  risk_level: "High"
  external_url: "https://kubernetes.io/docs/concepts/storage/persistent-volumes/"
  example: |
    # Pod references non-existent PVC 'app-data'
    apiVersion: v1
    kind: Pod
    metadata:
      name: app
    spec:
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: app-data
      containers:
        - name: app
          image: my-app:1.0.0
          volumeMounts:
            - name: data
              mountPath: /data
    # Fix: add matching PVC
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: app-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi

"rule/port-mismatch":
  name: "Service Port Mismatch"
  severity: "Error"
  description: "Service targetPort does not exist on the target Pod containers."
  rationale: "Traffic is accepted by the Service but dropped by the Pod because no process listens on the configured port."
  remediation: "Update 'service.spec.ports[].targetPort' to match a 'containerPort' defined in your workload."
  impact_description: "Traffic drop: external requests reaching the Service will receive 504 Gateway Timeout or 'Connection Refused' as no backend process is bound to the target port."
  risk_level: "High"
  external_url: "https://kubernetes.io/docs/concepts/services-networking/service/#defining-a-service"
  example: |
    # Mismatch: Service routes to targetPort 8080, but container listens on 8000
    apiVersion: v1
    kind: Service
    metadata:
      name: web
    spec:
      selector:
        app: web
      ports:
        - port: 80
          targetPort: 8080
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: web
    spec:
      template:
        metadata:
          labels:
            app: web
        spec:
          containers:
            - name: web
              image: my-web:1.0.0
              ports:
                - containerPort: 8000

"rule/ingress-broken":
  name: "Broken Ingress Backend"
  severity: "Error"
  description: "Ingress references a Service or port that does not exist."
  rationale: "External traffic reaching the Ingress controller will receive 502/503 errors because the backend service is unreachable."
  remediation: "Verify the Service name and port in the Ingress rules match an existing Service and declared Service port."
  impact_description: "The application is unreachable from the internet, leading to a total service outage for external users."
  risk_level: "Critical"
  example: |
    # Ingress points to non-existent Service 'web-svc'
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: web
    spec:
      rules:
        - http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: web-svc   # No such Service
                    port:
                      number: 80
    # Fix: define Service 'web-svc' with matching port
    apiVersion: v1
    kind: Service
    metadata:
      name: web-svc
    spec:
      selector:
        app: web
      ports:
        - port: 80
          targetPort: 8080

"rule/schema-mismatch":
  name: "K8s Schema Violation"
  severity: "Error"
  description: "The resource manifest does not comply with the Kubernetes OpenAPI schema."
  rationale: "Kubernetes will reject this manifest; this usually indicates an invalid field name, wrong data type, or missing required field."
  remediation: "Review the visual diff and use 'yamlr heal' to align the manifest with the target cluster's schema."
  impact_description: "API Rejection: the manifest cannot be applied to the cluster, causing deployment pipelines to fail and preventing updates to the resource."
  risk_level: "High"
  external_url: "https://kubernetes.io/docs/concepts/overview/working-with-objects/kubernetes-objects/"
  example: |
    # Invalid field 'imagee' (typo) will cause schema violation
    apiVersion: v1
    kind: Pod
    metadata:
      name: bad-pod
    spec:
      containers:
        - name: app
          imagee: my-app:1.0.0   # 'image' is the valid field
    # Fix: use correct field name
      containers:
        - name: app
          image: my-app:1.0.0

"rule/opa-violation":
  name: "OPA Policy Violation"
  severity: "Mixed"
  description: "The manifest violated an external OPA/Rego policy."
  rationale: "Enterprise policies (for example, 'must have owner label') may block deployments or CI/CD pipelines when violated."
  remediation: "Review the OPA message and update labels, annotations, or fields in the manifest to satisfy the policy."
  example: |
    # Example OPA policy: require 'owner' label on all Deployments
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: api
      labels:
        app: api
        # Missing 'owner' label -> OPA violation
    # Fix: add required label
      labels:
        app: api
        owner: platform-team

"rule/unsafe-hostpath":
  name: "Unsafe HostPath Mount"
  severity: "High"
  description: "Detects hostPath volumes that mount unapproved paths on the node filesystem."
  rationale: "hostPath mounts can expose sensitive parts of the node and are a common vector for privilege escalation and data exfiltration; most clusters should restrict or forbid them."
  remediation: "Avoid hostPath where possible. Prefer 'emptyDir', 'configMap', or persistent volumes. If hostPath is required, mount only approved directories (for example '/var/log' or '/tmp') and enforce an allowlist via policy."
  example: |
    # Unsafe: hostPath to root filesystem
    volumes:
      - name: host-root
        hostPath:
          path: /      # Not in approved prefixes
    # Safer: use PVC or a restricted hostPath path
    volumes:
      - name: logs
        hostPath:
          path: /var/log  # Example of an approved prefix

"rule/host-network":
  name: "Host Network Enabled"
  severity: "Warning"
  description: "Workloads should not use hostNetwork in regular namespaces."
  rationale: "hostNetwork exposes Pods directly on the node network stack, increasing blast radius and bypassing some network isolation. It is typically reserved for system components."
  remediation: "Remove 'hostNetwork: true' unless strictly required. Prefer normal cluster networking, and if needed, restrict hostNetwork to system namespaces only."
  impact_description: "Network isolation bypass: the pod gains access to the loopback device on the host and can potentially monitor traffic of other pods on the same node."
  risk_level: "High"
  external_url: "https://kubernetes.io/docs/concepts/security/pod-security-standards/#baseline"
  example: |
    # Risky: hostNetwork enabled in application namespace
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: nginx
      namespace: production
    spec:
      template:
        spec:
          hostNetwork: true
          containers:
            - name: nginx
              image: nginx:1.25.3
    # Better: disable hostNetwork and use ClusterIP/Service
      template:
        spec:
          hostNetwork: false
          containers:
            - name: nginx
              image: nginx:1.25.3

"rule/allow-privilege-escalation":
  name: "Privilege Escalation Allowed"
  severity: "High"
  description: "Containers should not enable allowPrivilegeEscalation."
  rationale: "allowPrivilegeEscalation lets a process gain more privileges than its parent and is often disallowed by hardened Pod Security policies."
  remediation: "Set 'securityContext.allowPrivilegeEscalation: false' for containers, and ensure applications do not rely on privilege escalation."
  impact_description: "Privilege escalation: a non-root user can gain root privileges using 'setuid' binaries or other kernel-level mechanisms if this flag is enabled."
  risk_level: "High"
  external_url: "https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted"
  example: |
    # Risky: explicitly allows privilege escalation
    containers:
      - name: app
        image: my-app:1.0.0
        securityContext:
          allowPrivilegeEscalation: true
    # Safer: explicitly disable privilege escalation
      - name: app
        image: my-app:1.0.0
        securityContext:
          allowPrivilegeEscalation: false

"rule/service-no-selector":
  name: "Service Without Selector"
  severity: "Warning"
  description: "A Service is defined without a selector and is not clearly a special-case Service."
  rationale: "Services without selectors do not automatically route to Pods and often indicate a misconfiguration unless used for advanced patterns."
  remediation: "Add a 'spec.selector' that matches your workload labels, or explicitly mark the Service as 'ExternalName' or headless if that is the intended pattern."
  example: |
    # Suspicious: ClusterIP Service without selector or special type
    apiVersion: v1
    kind: Service
    metadata:
      name: api
    spec:
      type: ClusterIP
      ports:
        - port: 80
      # No selector defined
    # Typical pattern: add selector to point at Pods
    apiVersion: v1
    kind: Service
    metadata:
      name: api
    spec:
      selector:
        app: api
      ports:
        - port: 80
          targetPort: 8080

"rule/missing-configmap-target":
  name: "Missing ConfigMap Target"
  severity: "Warning"
  description: "A workload references a ConfigMap that is not defined in the supplied manifests."
  rationale: "Pods depending on this ConfigMap will fail to start or behave unexpectedly if the referenced ConfigMap is missing from the cluster or the deployment bundle."
  remediation: "Create a ConfigMap with the referenced name in this file/set, or update the reference to an existing ConfigMap. If the ConfigMap is intentionally optional, mark the reference as 'optional: true'."
  example: |
    # Pod references non-existent ConfigMap 'app-config'
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: web
    spec:
      template:
        spec:
          containers:
            - name: web
              image: my-web:1.0.0
              envFrom:
                - configMapRef:
                    name: app-config   # No such ConfigMap in this file/set

    # Fix 1: define matching ConfigMap
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: app-config
    data:
      APP_ENV: prod

    # Fix 2: update reference to an existing ConfigMap
    # envFrom:
    #   - configMapRef:
    #       name: web-config

    # Fix 3: explicitly mark as optional if it may not exist
    # envFrom:
    #   - configMapRef:
    #       name: app-config
    #       optional: true

"rule/network-policy-missing":
  name: Missing Network Policy
  severity: warning
  description: The namespace (or resource) lacks a default-deny NetworkPolicy.
  rationale: |
    By default, all pods in a cluster can communicate with each other. 
    Implementing a default-deny policy ensures a "Zero Trust" posture, 
    requiring explicit allow-rules for traffic.
  remediation: |
    Create a default-deny NetworkPolicy for the namespace. 
    Yamlr can auto-generate this using: `yamlr heal --harden`.
  example: |
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: default-deny-all
    spec:
      podSelector: {}
      policyTypes: ["Ingress", "Egress"]

"rule/untrusted-registry":
  name: "Untrusted Image Registry"
  severity: "High"
  description: "Container images should only be pulled from approved enterprise registries."
  rationale: "Pulling from public or untrusted registries increases the risk of supply chain attacks, malware, and inconsistent build environments."
  remediation: "Update the 'image' field to use an approved registry (for example, 'cr.my-company.com/nginx:1.25') or add the registry to 'security.trusted_registries' in .yamlr.yaml."
  impact_description: "Supply Chain Risk: unvetted images from public registries may contain vulnerabilities or malicious code that bypasses organizational security controls."
  risk_level: "High"
  external_url: "https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted"
  example: |
    # Bad: pulling from public docker.io when restricted
    containers:
      - name: web
        image: nginx:latest
    # Good: pulling from trusted internal registry
    containers:
      - name: web
        image: cr.my-company.com/nginx:1.25.3

"schema/validation-error":
  name: "Strict Schema Violation"
  severity: "Error"
  description: "The manifest contains a structural error that makes it invalid for the target Kubernetes version."
  rationale: "Structural errors (like incorrect indentation or missing required top-level fields) prevent the manifest from being parsed by the K8s API."
  remediation: "Review the exact field listed in the error and align it with the K8s API documentation for that Resource Kind."
  impact_description: "Syntax Error: the manifest is malformed and cannot be parsed by Yamlr or Kubernetes, blocking all healing and scanning logic."
  risk_level: "High"
  external_url: "https://kubernetes.io/docs/reference/using-api/api-overview/"

"schema/invalid-api-version":
  name: "Invalid API Version"
  severity: "Error"
  description: "The specified apiVersion is not recognized by any schema in the current catalog."
  rationale: "Using an incorrect apiVersion (for example, 'app/v1' instead of 'apps/v1') will cause 'kubectl apply' to fail immediately."
  remediation: "Correct the apiVersion. Use 'yamlr explain rules' to see supported versions."

"policy.rego/required-labels":
  name: "Required Labels Missing"
  severity: "Mixed"
  description: "The manifest is missing one or more required labels as defined by external OPA/Rego policies."
  rationale: "Enterprise governance often requires labels like 'environment', 'owner', or 'cost-center' for resource tracking and billing."
  remediation: "Add the missing labels to the 'metadata.labels' section of the manifest."

"rule/dangerous-capabilities":
  name: "Dangerous Linux Capabilities"
  severity: "High"
  description: "Detects containers requesting dangerous capabilities like SYS_ADMIN, NET_ADMIN, or ALL."
  rationale: "Capabilities allow fine-grained privilege assignment, but certain ones are equivalent to full root access and can be used to escape the container."
  remediation: "Remove dangerous capabilities from 'securityContext.capabilities.add' and explicitly drop 'ALL' in 'securityContext.capabilities.drop'."
  impact_description: "Container Breakout: dangerous capabilities allow a process to bypass DAC checks or interact with the host kernel in ways that can lead to pod escape."
  risk_level: "High"
  external_url: "https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-capabilities-for-a-container"

"rule/sensitive-volume-mount":
  name: "Sensitive Volume Mount"
  severity: "High"
  description: "Detects hostPath volumes mounting sensitive system directories (e.g., /etc, /root, /var/run/docker.sock)."
  rationale: "Exposing sensitive host paths allows containers to escape their sandbox and compromise the underlying node level security."
  remediation: "Avoid mounting sensitive host paths. Use emptyDir or specialized CSI drivers for persistent storage."

"rule/host-pid":
  name: "Host PID Namespace Exposure"
  severity: "Error"
  description: "Detects pods sharing the host's PID namespace (hostPID: true)."
  rationale: "Sharing the host PID namespace allows a container to see and interact with all processes on the node, breaking process isolation."
  remediation: "Set 'spec.hostPID: false' in the Pod specification."

"rule/host-ipc":
  name: "Host IPC Namespace Exposure"
  severity: "Error"
  description: "Detects pods sharing the host's IPC namespace (hostIPC: true)."
  rationale: "Sharing the host IPC namespace allows a container to access inter-process communication on the node, potentially leaking data."
  remediation: "Set 'spec.hostIPC: false' in the Pod specification."

"rule/rbac-wildcard":
  name: "RBAC Wildcard Verbs/Resources"
  severity: "Critical"
  description: "Detects the use of wildcards (*) in RBAC Roles or ClusterRoles."
  rationale: "Wildcards grant 'God-mode' permissions, violating the principle of least privilege and making audit logs less useful."
  remediation: "Explicitly list required verbs (e.g., get, list) and resources instead of using '*'."
  impact_description: "Privilege Over-Grant: wildcards provide 'blanket' access that allows users to perform any action on any resource, effectively bypassing RBAC controls."
  risk_level: "Critical"
  external_url: "https://kubernetes.io/docs/reference/access-authn-authz/rbac/#role-and-clusterrole"

"rule/rbac-privilege-escalation":
  name: "RBAC Privilege Escalation"
  severity: "Critical"
  description: "Detects roles that grant the ability to escalate privileges (e.g., bind/escalate verbs)."
  rationale: "Users with these permissions can grant themselves higher privileges than they currently possess."
  remediation: "Remove 'bind' or 'escalate' verbs from roles unless strictly required for system controllers."

"rule/rbac-sensitive-resource":
  name: "RBAC Sensitive Resource Access"
  severity: "High"
  description: "Detects access to sensitive resources like Secrets or Nodes."
  rationale: "Unrestricted access to Secrets can lead to credential theft across the entire cluster."
  remediation: "Restrict Secret access to specific resources using 'resourceNames' or dedicated ServiceAccounts."

"rule/rbac-suspicious-binding":
  name: "Suspicious RoleBinding"
  severity: "Warning"
  description: "Detects cluster-admin or powerful roles bound to common users or service accounts."
  rationale: "Powerful roles should be reserved for administrators and system-level automation."
  remediation: "Downgrade the binding to a more restrictive role like 'edit' or 'view'."

"rule/ingress-tls-missing":
  name: "Ingress TLS Missing"
  severity: "High"
  description: "Detects Ingress resources that serve traffic over HTTP without TLS configuration."
  rationale: "Unencrypted traffic is susceptible to interception and tampering. Modern web standards require TLS for all public-facing services."
  remediation: "Add a 'spec.tls' section with the appropriate 'hosts' and 'secretName'."
  impact_description: "Data-in-Transit Exposure: unencrypted application traffic can be intercepted (MitM) or modified between the client and the Ingress controller."
  risk_level: "High"
  external_url: "https://kubernetes.io/docs/concepts/services-networking/ingress/#tls"

"rule/ingress-class-missing":
  name: "Ingress Class Missing"
  severity: "Warning"
  description: "Detects Ingress resources missing 'spec.ingressClassName' or the legacy 'kubernetes.io/ingress.class' annotation."
  rationale: "Without an explicit IngressClass, the resource may not be picked up by any controller or may be handled by a non-deterministic default."
  remediation: "Set 'spec.ingressClassName' to the target controller (e.g., 'nginx')."

"rule/ingress-unsafe-annotation":
  name: "Unsafe Ingress Annotation"
  severity: "Critical"
  description: "Detects dangerous snippet annotations that can be used for configuration injection or bypasses."
  rationale: "Snippet annotations (e.g., configuration-snippet) allow arbitrary NGINX config insertion, which can be exploited to leak secrets or bypass security blocks."
  remediation: "Remove snippet annotations and use structured Ingress features or validated controller-specific fields."
  impact_description: "NGINX Injection: an attacker can inject arbitrary configuration into the Ingress controller’s process, potentially accessing the host filesystem or global controller secrets."
  risk_level: "Critical"
  external_url: "https://github.com/kubernetes/ingress-nginx/blob/main/docs/user-guide/nginx-configuration/annotations.md#configuration-snippet"

"rule/ingress-insecure-tls":
  name: "Insecure TLS Configuration"
  severity: "High"
  description: "Detects Ingress annotations that enable insecure TLS versions (TLS 1.0, 1.1) or weak ciphers."
  rationale: "Weak TLS protocols are vulnerable to downgrade attacks and do not meet modern compliance standards (e.g., PCI-DSS)."
  remediation: "Update annotations to enforce TLS 1.2+ and strong cipher suites."

"rule/ingress-wildcard-host":
  name: "Wildcard Ingress Host"
  severity: "Warning"
  description: "Detects Ingress rules that lack an explicit 'host' field, potentially allowing traffic for any host."
  rationale: "Wildcard hosts can catch traffic intended for other services if not carefully managed by the controller."
  remediation: "Define an explicit 'host' for each Ingress rule."

"rule/shield-resource-starvation":
  name: "Resource Starvation (High Impact)"
  severity: "Warning"
  description: "Detects high-impact workloads (top 10% blast radius) that lack CPU or memory limits."
  rationale: "Critical services without limits can cause cluster-wide instability if they consume excessive resources during a surge."
  remediation: "Add resources.limits to all containers in high-impact workloads."
  example: |
    # High Impact Service missing limits
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: checkout-api
      annotations:
        yamlr.io/impact: "business-critical"
    spec:
      template:
        spec:
          containers:
            - name: api
              image: checkout:2.0.1
              resources:
                requests:
                  cpu: "2"
                  memory: "4Gi"
                # Missing limits!

"SHD-003":
  name: "Sensitive Volume Exposure"
  severity: "Warning"
  description: "Secret or ConfigMap mounted into a container that also has a hostPath mount."
  rationale: "A compromised container with hostPath access could exfiltrate mounted secrets to the underlying node filesystem."
  remediation: "Avoid co-locating hostPath mounts with sensitive volume mounts in the same container."
  impact_description: "Credential Exfiltration: an attacker can use hostPath access to copy project-level secrets or config data onto the node, potentially exposing them to other users or processes."
  risk_level: "High"
  external_url: "https://kubernetes.io/docs/concepts/storage/volumes/#hostpath"

"SHD-005":
  name: "Resource Starvation (Blast Radius)"
  severity: "Warning"
  description: "High-impact workload lacks CPU or memory limits."
  rationale: "Critical services can starve the cluster if they surge without capping limits."
  remediation: "Add resources.limits to high-impact workloads."
  impact_description: "Blast Radius Expansion: failure in a critical service without limits can crash entire nodes, magnifying the impact of a single-service surge."
  risk_level: "High"
  external_url: "https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/"

"SHD-006":
  name: "Circular Dependency Trap"
  severity: "Warning"
  description: "Detected a cycle in resource dependencies (e.g., A depends on B depends on A)."
  rationale: "Circular dependencies cause 'Flapping' and 'Deadlock' during deployment or resolution."
  remediation: "Refactor architecture to remove the dependency loop."
  impact_description: "Deadlock: resources cannot be successfully scaled or updated because their state depends on each other in a loop, causing deployment hangs."
  risk_level: "Medium"
  external_url: "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"

"SHD-007":
  name: "Implicit Network Exposure"
  severity: "Warning"
  description: "Workload in a namespace with no default-deny NetworkPolicy."
  rationale: "By default, K8s allows all traffic. Without explicit isolation, compromised pods can laterally move across the cluster."
  remediation: "Implement a default-deny NetworkPolicy for the namespace."
  impact_description: "Lateral Movement: an attacker compromising a single pod can access any other pod or service in the namespace, including those that should be internal-only."
  risk_level: "High"
  external_url: "https://kubernetes.io/docs/concepts/services-networking/network-policies/"

"SHD-008":
  name: "High-Blast Orphan"
  severity: "Info"
  description: "A sensitive resource exists but is not used by any workload."
  rationale: "Unused sensitive resources (e.g., 'auth-key') increase the attack surface if leaked."
  remediation: "Delete the orphan resource if it's truly unused."
  impact_description: "Attack Surface Bloat: sensitive data remains in the cluster namespaces without purpose, providing an 'easy win' for attackers who gain access to the namespace."
  risk_level: "Medium"
  external_url: "https://kubernetes.io/docs/concepts/configuration/secret/"

"SHD-009":
  name: "High-Density Node Risk"
  severity: "Info"
  description: "A single node affects a large percentage of cluster resources (>15%)."
  rationale: "Concentrating impact in one node creates a single point of failure."
  remediation: "Distribute dependencies or increase redundancy for this resource."
  impact_description: "Reliability Bottleneck: losing this specific node would cause a disproportionate loss of cluster capacity (>15%), potentially causing a global outage."
  risk_level: "Medium"
  external_url: "https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/"

"SHD-010":
  name: "Escalation-Ready ServiceAccount"
  severity: "Critical"
  description: "ServiceAccount has a direct path to cluster-admin privileges."
  rationale: "An attacker compromising this pod gains full cluster control."
  remediation: "Reduce RBAC permissions to the minimum set required."

"SHD-011":
  name: "Zombie API Persistence"
  severity: "Warning"
  description: "Using a heavily deprecated or legacy API version."
  rationale: "Legacy APIs lack modern security features and will be removed in future K8s versions."
  remediation: "Upgrade apiVersion to the current stable version."

"SHD-012":
  name: "Disruption Blind-Spot"
  severity: "Warning"
  description: "High-impact workload has no PodDisruptionBudget."
  rationale: "Standard node maintenance or surges can take down critical services without a PDB."
  remediation: "Define a PDB with appropriate minAvailable or maxUnavailable."

"SHD-013":
  name: "Shadow Ingress Hijack"
  severity: "Warning"
  description: "Route collision detected across multiple Ingress resources."
  rationale: "Multiple controllers or rules competing for the same host/path leads to non-deterministic routing."
  remediation: "Consolidate Ingress rules to remove route overlap."

"SHD-014":
  name: "HPA Replica Conflict"
  severity: "Warning"
  description: "Static 'replicas' count conflicts with an active HorizontalPodAutoscaler."
  rationale: "Causes 'flapping' deployments where K8s and the HPA fight over the replica count."
  remediation: "Remove the static 'replicas' field from the Deployment spec."

"SHD-015":
  name: "CRD Version Drift"
  severity: "Warning"
  description: "Custom Resource uses a version not supported by the installed CRD."
  rationale: "Will result in validation errors or truncated fields in the cluster."
  remediation: "Sync the Custom Resource version with the target CRD."
  impact_description: "Operational Drift: using an unsupported CRD version results in fields being silently dropped or rejected, causing configuration loss or controller failure."
  risk_level: "Medium"
  external_url: "https://kubernetes.io/docs/concepts/extend-kubernetes/api-extension/custom-resources/"

