rules:
  # --- SAFE RESOURCES ---
  missing-configmap-ref:
    resource_type: ConfigMap
    description: "Referenced ConfigMap is missing from the document set."
    severity: WARNING
    safe_to_autoheal: true
    strategies:
      - stub
      - prune
    stub_template:
      kind: ConfigMap
      apiVersion: v1
      metadata:
        name: "{{name}}"
        annotations:
          yamlr.dev/autogenerated: "true"
      data:
        # Placeholder data to satisfy mounting/envFrom
        example-key: "auto-generated-stub"

  missing-serviceaccount-ref:
    resource_type: ServiceAccount
    description: "Referenced ServiceAccount is missing."
    severity: WARNING
    safe_to_autoheal: true
    strategies:
      - stub
    stub_template:
      kind: ServiceAccount
      apiVersion: v1
      metadata:
        name: "{{name}}"
        annotations:
          yamlr.dev/autogenerated: "true"

  missing-service-ref:
    resource_type: Service
    description: "Referenced Service is missing."
    severity: WARNING
    safe_to_autoheal: true
    strategies:
      - stub
    stub_template:
      kind: Service
      apiVersion: v1
      metadata:
        name: "{{name}}"
        annotations:
          yamlr.dev/autogenerated: "true"
      spec:
        ports:
          - port: 80
            targetPort: 8080
        selector:
          app: stub-selector

  # --- UNSAFE RESOURCES ---
  missing-secret-ref:
    resource_type: Secret
    description: "Referenced Secret is missing. Stubbing may break authentication."
    severity: WARNING
    safe_to_autoheal: false
    strategies:
      - stub
      - prune
    stub_template:
      kind: Secret
      apiVersion: v1
      metadata:
        name: "{{name}}"
        annotations:
          yamlr.dev/autogenerated: "true"
      type: Opaque
      data:
        # Base64 encoded 'password'
        password: cGFzc3dvcmQ=
  
  missing-secret-volume-ref:
    resource_type: Secret
    description: "Referenced Secret (Volume) is missing. Safe to stub to unblock pod creation."
    severity: WARNING
    safe_to_autoheal: true
    strategies:
      - stub
    stub_template:
      kind: Secret
      apiVersion: v1
      metadata:
        name: "{{name}}"
        annotations:
          yamlr.dev/autogenerated: "true"
      type: Opaque
      data:
        # Base64 encoded 'password'
        password: cGFzc3dvcmQ=

  missing-pvc-ref:
    resource_type: PersistentVolumeClaim
    description: "Referenced PVC is missing. Stubbing may result in data loss or empty volume."
    severity: WARNING
    safe_to_autoheal: false
    strategies:
      - stub
    stub_template:
      kind: PersistentVolumeClaim
      apiVersion: v1
      metadata:
        name: "{{name}}"
        annotations:
          yamlr.dev/autogenerated: "true"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

  # --- NETWORKING & STORAGE (SAFE) ---
  missing-ingress-ref:
    resource_type: Ingress
    description: "Referenced Ingress backend or target is missing."
    severity: WARNING
    safe_to_autoheal: true
    strategies:
      - stub
    stub_template:
      kind: Ingress
      apiVersion: networking.k8s.io/v1
      metadata:
        name: "{{name}}"
        annotations:
          yamlr.dev/autogenerated: "true"
      spec:
        rules:
          - http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: stub-service
                      port:
                        number: 80

  missing-storageclass-ref:
    resource_type: StorageClass
    description: "Referenced StorageClass is missing."
    severity: WARNING
    safe_to_autoheal: true
    strategies:
      - stub
    stub_template:
      kind: StorageClass
      apiVersion: storage.k8s.io/v1
      metadata:
        name: "{{name}}"
        annotations:
          yamlr.dev/autogenerated: "true"
      provisioner: kubernetes.io/no-provisioner
      reclaimPolicy: Retain

  missing-ingressclass-ref:
    resource_type: IngressClass
    description: "Referenced IngressClass is missing."
    severity: WARNING
    safe_to_autoheal: true
    strategies:
      - stub
    stub_template:
      kind: IngressClass
      apiVersion: networking.k8s.io/v1
      metadata:
        name: "{{name}}"
        annotations:
          yamlr.dev/autogenerated: "true"
      spec:
        controller: k8s.io/ingress-nginx

  # --- GOVERNANCE & POLICY (SAFE) ---
  missing-resourcequota-ref:
    resource_type: ResourceQuota
    description: "Referenced ResourceQuota is missing."
    severity: WARNING
    safe_to_autoheal: true
    strategies:
      - stub
    stub_template:
      kind: ResourceQuota
      apiVersion: v1
      metadata:
        name: "{{name}}"
        annotations:
          yamlr.dev/autogenerated: "true"
      spec:
        hard:
          requests.cpu: "1"
          requests.memory: 1Gi
          limits.cpu: "2"
          limits.memory: 2Gi

  missing-limitrange-ref:
    resource_type: LimitRange
    description: "Referenced LimitRange is missing."
    severity: WARNING
    safe_to_autoheal: true
    strategies:
      - stub
    stub_template:
      kind: LimitRange
      apiVersion: v1
      metadata:
        name: "{{name}}"
        annotations:
          yamlr.dev/autogenerated: "true"
      spec:
        limits:
          - default:
              cpu: 500m
              memory: 512Mi
            defaultRequest:
              cpu: 100m
              memory: 128Mi
            type: Container

  # --- RBAC (UNSAFE) ---
  missing-role-ref:
    resource_type: Role
    description: "Referenced Role is missing. Stubbing with empty permissions."
    severity: WARNING
    safe_to_autoheal: false
    strategies:
      - stub
    stub_template:
      kind: Role
      apiVersion: rbac.authorization.k8s.io/v1
      metadata:
        name: "{{name}}"
        annotations:
          yamlr.dev/autogenerated: "true"
      rules: [] # Empty by default (Secure but non-functional)

  missing-clusterrole-ref:
    resource_type: ClusterRole
    description: "Referenced ClusterRole is missing. Stubbing with empty permissions."
    severity: WARNING
    safe_to_autoheal: false
    strategies:
      - stub
    stub_template:
      kind: ClusterRole
      apiVersion: rbac.authorization.k8s.io/v1
      metadata:
        name: "{{name}}"
        annotations:
          yamlr.dev/autogenerated: "true"
      rules: []

  missing-networkpolicy-ref:
    resource_type: NetworkPolicy
    description: "Referenced NetworkPolicy is missing."
    severity: WARNING
    safe_to_autoheal: true
    strategies:
      - stub
    stub_template:
      kind: NetworkPolicy
      apiVersion: networking.k8s.io/v1
      metadata:
        name: "{{name}}"
        annotations:
          yamlr.dev/autogenerated: "true"
      spec:
        podSelector: {}
        policyTypes:
          - Ingress
        ingress: [] # Default Deny (Secure)

  rbac-wildcard:
    resource_type: RBAC
    description: "Wildcard (*) detected in RBAC rules (verbs, resources, or apiGroups)."
    severity: ERROR
    safe_to_autoheal: false
    rationale: "Using wildcards in RBAC allows excessive permissions that violate the principle of least privilege."
    impact_description: "An attacker could gain full control over the cluster or specific resources if they compromise a service account with wildcard permissions."

  rbac-privilege-escalation:
    resource_type: RBAC
    description: "Permissions allowing privilege escalation detected."
    severity: CRITICAL
    safe_to_autoheal: false
    rationale: "Certain verbs (e.g., bind, impersonate, update) on RBAC resources allow a user to escalate their own permissions."
    impact_description: "A user could grant themselves cluster-admin privileges or impersonate more powerful users."

  # --- BEST PRACTICES (NEW) ---
  image-tag-check:
    resource_type: Container
    description: "Container uses ':latest' or no tag."
    severity: ERROR
    safe_to_autoheal: true
    rationale: "The ':latest' tag is mutable. Deployments using it are non-deterministic, making rollbacks unpredictable and caching inefficient."
    impact_description: "New Pods might pull a different version of the image than existing ones, causing inconsistent behavior across the cluster."
    risk_level: HIGH

  resource-requests:
    resource_type: Container
    description: "Container has no resource requests defined."
    severity: WARNING
    safe_to_autoheal: true
    rationale: "Without resource requests, the Kubernetes scheduler cannot accurately bin-pack nodes, leading to potential starvation."
    impact_description: "The scheduler might over-subscribe nodes, causing CPU throttling or Memory OOM kills during peak usage."
    risk_level: MEDIUM

  resource-limits:
    resource_type: Container
    description: "Container has no resource limits defined."
    severity: WARNING
    safe_to_autoheal: true
    rationale: "Without resource limits, a single container can consume all available node resources, causing cascading failures."
    impact_description: "A 'noisy neighbor' container can starve other critical system processes or app Pods of memory."
    risk_level: HIGH

  missing-liveness:
    resource_type: Container
    description: "Container missing livenessProbe."
    severity: WARNING
    safe_to_autoheal: true
    rationale: "Liveness probes are essential for self-healing, allowing Kubelet to restart deadlocked applications."
    impact_description: "If the process hangs, the Pod remains 'Running' but serves no traffic, leading to silent outages."
    risk_level: MEDIUM

  missing-readiness:
    resource_type: Container
    description: "Container missing readinessProbe."
    severity: WARNING
    safe_to_autoheal: true
    rationale: "Readiness probes prevent traffic routing to Pods that are still booting or overloaded."
    impact_description: "Clients may experience 502/503 errors during deployments as traffic is sent to Pods not yet ready."
    risk_level: MEDIUM

  # --- SECURITY & HARDENING ---
  rule/host-network:
    resource_type: Pod
    description: "Pod uses the host's network namespace."
    severity: WARNING
    safe_to_autoheal: false
    rationale: "hostNetwork exposes the node's network namespace to the Pod, bypassing network isolation."
    impact_description: "A compromised Pod can intercept node-level traffic or access local services bound to the host network."
    external_url: "https://kubernetes.io/docs/concepts/policy/pod-security-policy/"
    category: "Network Security"
    risk_level: HIGH

  rule/host-pid:
    resource_type: Pod
    description: "Pod uses the host's PID namespace."
    severity: ERROR
    safe_to_autoheal: false
    rationale: "hostPID allows a container to see all processes on the node, potentially exposing sensitive information."
    impact_description: "A compromised container can spy on or kill processes outside its sandbox."
    external_url: "https://kubernetes.io/docs/concepts/policy/pod-security-policy/"
    category: "Host Security"
    risk_level: HIGH

  rule/host-ipc:
    resource_type: Pod
    description: "Pod uses the host's IPC namespace."
    severity: ERROR
    safe_to_autoheal: false
    rationale: "hostIPC allows a container to communicate with other processes on the host via IPC."
    impact_description: "Potential data leakage between unrelated containers or host processes."
    external_url: "https://kubernetes.io/docs/concepts/policy/pod-security-policy/"
    category: "Data Security"
    risk_level: HIGH

  rule/run-as-non-root:
    resource_type: Pod
    description: "Pod or container should run as a non-root user."
    severity: ERROR
    safe_to_autoheal: true
    rationale: "Running containers as root allows an attacker who escapes the container to gain full root privileges on the node."
    impact_description: "An attacker will have root privileges on the node, making host takeover trivial."
    external_url: "https://kubernetes.io/docs/tasks/configure-pod-container/security-context/"
    category: "Container Security"
    risk_level: CRITICAL

  rule/no-privileged:
    resource_type: Container
    description: "Container is running in Privileged mode."
    severity: ERROR
    safe_to_autoheal: false
    rationale: "Privileged mode disables almost all container security isolations."
    impact_description: "Complete node compromise if the container is exploited."
    external_url: "https://kubernetes.io/docs/tasks/configure-pod-container/security-context/"
    category: "Container Security"
    risk_level: CRITICAL

  rule/allow-privilege-escalation:
    resource_type: Container
    description: "Container allows privilege escalation."
    severity: HIGH
    safe_to_autoheal: true
    rationale: "Processes inside the container can gain more privileges than their parent process."
    impact_description: "Attackers can use common privilege escalation techniques within the container."
    external_url: "https://kubernetes.io/docs/tasks/configure-pod-container/security-context/"
    category: "Container Security"
    risk_level: HIGH

  rule/unsafe-hostpath:
    resource_type: Volume
    description: "Volume uses an unsafe hostPath mount."
    severity: HIGH
    safe_to_autoheal: false
    rationale: "Mounting sensitive host paths allows a container to read or write to the node's filesystem."
    impact_description: "A compromised container could escalate privileges to the node by modifying system files."
    external_url: "https://kubernetes.io/docs/concepts/storage/volumes/#hostpath"
    category: "Host Security"
    risk_level: CRITICAL

  rule/missing-namespace:
    resource_type: Resource
    description: "Resource is missing an explicit namespace."
    severity: WARNING
    safe_to_autoheal: true
    rationale: "Explicit namespaces prevent accidental deployment to the 'default' namespace, which often lacks appropriate resource quotas or network policies."
    impact_description: "The resource will be created in the active context's namespace (usually 'default'), potentially leading to resource collisions or security policy bypasses."
    category: "Governance"
    risk_level: MEDIUM

  # --- SHADOW RISKS (PRO) ---
  SHD-003:
    resource_type: Volume
    description: "Shadow Risk: Sensitive volume co-located with HostPath mount."
    severity: WARNING
    safe_to_autoheal: false
    rationale: "Co-locating sensitive volumes (Secrets/ConfigMaps) with hostPath mounts increases the risk of data exfiltration via the host filesystem."
    impact_description: "Potential data leakage between unrelated containers or host processes."
    external_url: "https://kubernetes.io/docs/concepts/configuration/secret/"
    category: "Data Security"
    risk_level: MEDIUM

  SHD-005:
    resource_type: Container
    description: "Shadow Risk: High-impact workload lacks resource limits."
    severity: WARNING
    safe_to_autoheal: true
    rationale: "Missing resource limits in high-blast-radius workloads can lead to 'Noisy Neighbor' effects that crash the entire node."
    impact_description: "Reliability degradation or node instability if the workload experiences a spike."
    external_url: "https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/"
    category: "Reliability"
    risk_level: MEDIUM
