rules:
  # --- SAFE RESOURCES ---
  missing-configmap-ref:
    resource_type: ConfigMap
    description: "Referenced ConfigMap is missing from the document set."
    severity: WARNING
    safe_to_autoheal: true
    strategies:
      - stub
      - prune
    stub_template:
      kind: ConfigMap
      apiVersion: v1
      metadata:
        name: "{{name}}"
        annotations:
          yamlr.dev/autogenerated: "true"
      data:
        # Placeholder data to satisfy mounting/envFrom
        example-key: "auto-generated-stub"

  missing-serviceaccount-ref:
    resource_type: ServiceAccount
    description: "Referenced ServiceAccount is missing."
    severity: WARNING
    safe_to_autoheal: true
    strategies:
      - stub
    stub_template:
      kind: ServiceAccount
      apiVersion: v1
      metadata:
        name: "{{name}}"
        annotations:
          yamlr.dev/autogenerated: "true"

  missing-service-ref:
    resource_type: Service
    description: "Referenced Service is missing."
    severity: WARNING
    safe_to_autoheal: true
    strategies:
      - stub
    stub_template:
      kind: Service
      apiVersion: v1
      metadata:
        name: "{{name}}"
        annotations:
          yamlr.dev/autogenerated: "true"
      spec:
        ports:
          - port: 80
            targetPort: 8080
        selector:
          app: stub-selector

  # --- UNSAFE RESOURCES ---
  missing-secret-ref:
    resource_type: Secret
    description: "Referenced Secret is missing. Stubbing may break authentication."
    severity: WARNING
    safe_to_autoheal: false
    strategies:
      - stub
      - prune
    stub_template:
      kind: Secret
      apiVersion: v1
      metadata:
        name: "{{name}}"
        annotations:
          yamlr.dev/autogenerated: "true"
      type: Opaque
      data:
        # Base64 encoded 'password'
        password: cGFzc3dvcmQ=
  
  missing-secret-volume-ref:
    resource_type: Secret
    description: "Referenced Secret (Volume) is missing. Safe to stub to unblock pod creation."
    severity: WARNING
    safe_to_autoheal: true
    strategies:
      - stub
    stub_template:
      kind: Secret
      apiVersion: v1
      metadata:
        name: "{{name}}"
        annotations:
          yamlr.dev/autogenerated: "true"
      type: Opaque
      data:
        # Base64 encoded 'password'
        password: cGFzc3dvcmQ=

  missing-pvc-ref:
    resource_type: PersistentVolumeClaim
    description: "Referenced PVC is missing. Stubbing may result in data loss or empty volume."
    severity: WARNING
    safe_to_autoheal: false
    strategies:
      - stub
    stub_template:
      kind: PersistentVolumeClaim
      apiVersion: v1
      metadata:
        name: "{{name}}"
        annotations:
          yamlr.dev/autogenerated: "true"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

  # --- NETWORKING & STORAGE (SAFE) ---
  missing-ingress-ref:
    resource_type: Ingress
    description: "Referenced Ingress backend or target is missing."
    severity: WARNING
    safe_to_autoheal: true
    strategies:
      - stub
    stub_template:
      kind: Ingress
      apiVersion: networking.k8s.io/v1
      metadata:
        name: "{{name}}"
        annotations:
          yamlr.dev/autogenerated: "true"
      spec:
        rules:
          - http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: stub-service
                      port:
                        number: 80

  missing-storageclass-ref:
    resource_type: StorageClass
    description: "Referenced StorageClass is missing."
    severity: WARNING
    safe_to_autoheal: true
    strategies:
      - stub
    stub_template:
      kind: StorageClass
      apiVersion: storage.k8s.io/v1
      metadata:
        name: "{{name}}"
        annotations:
          yamlr.dev/autogenerated: "true"
      provisioner: kubernetes.io/no-provisioner
      reclaimPolicy: Retain

  missing-ingressclass-ref:
    resource_type: IngressClass
    description: "Referenced IngressClass is missing."
    severity: WARNING
    safe_to_autoheal: true
    strategies:
      - stub
    stub_template:
      kind: IngressClass
      apiVersion: networking.k8s.io/v1
      metadata:
        name: "{{name}}"
        annotations:
          yamlr.dev/autogenerated: "true"
      spec:
        controller: k8s.io/ingress-nginx

  # --- GOVERNANCE & POLICY (SAFE) ---
  missing-resourcequota-ref:
    resource_type: ResourceQuota
    description: "Referenced ResourceQuota is missing."
    severity: WARNING
    safe_to_autoheal: true
    strategies:
      - stub
    stub_template:
      kind: ResourceQuota
      apiVersion: v1
      metadata:
        name: "{{name}}"
        annotations:
          yamlr.dev/autogenerated: "true"
      spec:
        hard:
          requests.cpu: "1"
          requests.memory: 1Gi
          limits.cpu: "2"
          limits.memory: 2Gi

  missing-limitrange-ref:
    resource_type: LimitRange
    description: "Referenced LimitRange is missing."
    severity: WARNING
    safe_to_autoheal: true
    strategies:
      - stub
    stub_template:
      kind: LimitRange
      apiVersion: v1
      metadata:
        name: "{{name}}"
        annotations:
          yamlr.dev/autogenerated: "true"
      spec:
        limits:
          - default:
              cpu: 500m
              memory: 512Mi
            defaultRequest:
              cpu: 100m
              memory: 128Mi
            type: Container

  # --- RBAC (UNSAFE) ---
  missing-role-ref:
    resource_type: Role
    description: "Referenced Role is missing. Stubbing with empty permissions."
    severity: WARNING
    safe_to_autoheal: false
    strategies:
      - stub
    stub_template:
      kind: Role
      apiVersion: rbac.authorization.k8s.io/v1
      metadata:
        name: "{{name}}"
        annotations:
          yamlr.dev/autogenerated: "true"
      rules: [] # Empty by default (Secure but non-functional)

  missing-clusterrole-ref:
    resource_type: ClusterRole
    description: "Referenced ClusterRole is missing. Stubbing with empty permissions."
    severity: WARNING
    safe_to_autoheal: false
    strategies:
      - stub
    stub_template:
      kind: ClusterRole
      apiVersion: rbac.authorization.k8s.io/v1
      metadata:
        name: "{{name}}"
        annotations:
          yamlr.dev/autogenerated: "true"
      rules: []

  missing-networkpolicy-ref:
    resource_type: NetworkPolicy
    description: "Referenced NetworkPolicy is missing."
    severity: WARNING
    safe_to_autoheal: true
    strategies:
      - stub
    stub_template:
      kind: NetworkPolicy
      apiVersion: networking.k8s.io/v1
      metadata:
        name: "{{name}}"
        annotations:
          yamlr.dev/autogenerated: "true"
      spec:
        podSelector: {}
        policyTypes:
          - Ingress
        ingress: [] # Default Deny (Secure)
