# Yamlr Reconciliation Mappings
# Maps external tool check IDs to Yamlr native Rule IDs for automated healing.

checkov:
  # Security Context / RBAC
  CKV_K8S_21: "security/run-as-non-root"
  CKV_K8S_14: "security/run-as-non-root"
  CKV_K8S_15: "security/privileged-container"
  CKV_K8S_16: "security/read-only-root-filesystem"
  CKV_K8S_20: "security/allow-privilege-escalation"
  
  # Resource Management
  CKV_K8S_10: "resources/cpu-limit-missing"
  CKV_K8S_11: "resources/cpu-request-missing"
  CKV_K8S_12: "resources/memory-limit-missing"
  CKV_K8S_13: "resources/memory-request-missing"
  
  # Best Practices
  CKV_K8S_8: "best-practices/no-liveness-probe"
  CKV_K8S_9: "best-practices/no-readiness-probe"
  CKV_K8S_23: "best-practices/no-default-namespace"

kubeconform:
  # Kubeconform usually yields structural errors, which might map to schema rules
  "Invalid type": "schema/type-mismatch"
  "Missing required field": "schema/missing-field"
  "validation-error": "schema/validation-error"
