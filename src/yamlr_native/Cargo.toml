[package]
name = "yamlr-native"
version = "0.1.0"
edition = "2021"
authors = ["Yamlr Team"]
description = "High-performance native acceleration for Yamlr core (Lexer/Scanner)."

[lib]
name = "yamlr_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
regex = "1.7"
rayon = "1.7"
lazy_static = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
