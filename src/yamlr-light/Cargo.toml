[package]
name = "yamlr-light"
version = "1.0.0"
edition = "2021"
authors = ["Yamlr Team"]
description = "Ultra-fast K8s manifest scanner for enterprise-scale monorepos."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ignore = "0.4"
rayon = "1.7"
clap = { version = "4.0", features = ["derive"] }
regex = "1.7"
lazy_static = "1.4"
chrono = { version = "0.4", features = ["serde"] }
num_cpus = "1.0"
flate2 = "1.0"
zstd = "0.13"
tar = "0.4"

[profile.release]
opt-level = 'z'     # Optimize for size.
lto = true          # Link Time Optimization across all crates.
codegen-units = 1   # Reduce parallel code generation for better optimization.
panic = 'abort'     # Remove panic unwinding to save space.
strip = true        # Automatically strip symbols from the binary.
